<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Triage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E9C232">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backcountry Triage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: single narrow column, field-notebook yellow band header, big gloved-finger answer buttons */
:root{
  --bg:#ECEEE9; --surface:#F8F9F6; --ink:#1B211D; --muted:#56615A; --line:#CAD1C9;
  --btn:#1B211D; --on-btn:#F8F9F6;
  --band:#E9C232; --on-band:#1B211D;
  --rapid:#B3261E; --rapid-bg:#F7DFDB; --evac:#8F5400; --evac-bg:#F5E6CA; --field:#2D6843; --field-bg:#DBEADF;
  --f-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101311; --surface:#191E1A; --ink:#E3E8E1; --muted:#9BA69D; --line:#2C342E;
  --btn:#E3E8E1; --on-btn:#101311;
  --rapid:#FF8B7F; --rapid-bg:#3B1713; --evac:#F1B45C; --evac-bg:#352611; --field:#80CB97; --field-bg:#15291C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101311; --surface:#191E1A; --ink:#E3E8E1; --muted:#9BA69D; --line:#2C342E;
  --btn:#E3E8E1; --on-btn:#101311;
  --rapid:#FF8B7F; --rapid-bg:#3B1713; --evac:#F1B45C; --evac-bg:#352611; --field:#80CB97; --field-bg:#15291C;
  color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--band);z-index:20}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--band);outline-offset:2px}
.gut{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--band);color:var(--on-band)}
.top .gut{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font:800 22px/1 var(--f-display);font-stretch:condensed;text-transform:uppercase;letter-spacing:.02em}
.brand span{font:500 11px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:3px}
.tabs{display:flex;background:rgba(27,33,29,.12);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;color:var(--on-band);padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px}
.tabs button[aria-selected="true"]{background:#1B211D;color:#E9C232}

main .gut{padding-block:20px 56px}

/* found-so-far strip */
.found{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.found .lbl{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.chip.rapid{border-color:var(--rapid);color:var(--rapid);background:var(--rapid-bg)}
.chip.evac{border-color:var(--evac);color:var(--evac);background:var(--evac-bg)}
.chip.field{border-color:var(--field);color:var(--field);background:var(--field-bg)}
.treatnow{background:var(--rapid-bg);border:1.5px solid var(--rapid);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.treatnow p{margin:0;font-weight:600;color:var(--rapid);min-width:0}
.treatnow button{border:0;background:var(--rapid);color:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700}

/* question */
.phase{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px}
.phase i{font-style:normal;opacity:.7}
.q h2{font:700 27px/1.18 var(--f-display);font-stretch:condensed;margin:10px 0 8px;text-wrap:balance}
.q .help{color:var(--muted);margin:0 0 4px;max-width:60ch}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.big{min-height:76px;border-radius:14px;font:700 24px/1 var(--f-display);font-stretch:condensed;letter-spacing:.03em;text-transform:uppercase}
.yes{background:var(--btn);color:var(--on-btn);border:2px solid var(--btn)}
.no{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.big:active{transform:translateY(1px)}
.opts{display:grid;gap:10px;margin-top:22px}
.opt{text-align:left;min-height:62px;padding:14px 18px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt:hover{border-color:var(--ink)}
.opt::after{content:"→";font-family:var(--f-mono);color:var(--muted)}
.navrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:default}

/* trail */
.trail{margin-top:32px;border-top:1px solid var(--line);padding-top:16px}
.trail h3,.sec h3{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.trail ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.trail li{display:grid;grid-template-columns:3.4em 1fr auto;gap:10px;font-size:14px;align-items:baseline}
.trail time{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.trail .a{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em}
.trail .qq{min-width:0;color:var(--ink)}

/* result */
.banner{border-radius:14px;padding:16px 18px;margin-bottom:18px;border:2px solid}
.banner.rapid{background:var(--rapid-bg);border-color:var(--rapid)}
.banner.evac{background:var(--evac-bg);border-color:var(--evac)}
.banner.field{background:var(--field-bg);border-color:var(--field)}
.banner.info{background:var(--surface);border-color:var(--ink)}
.banner .k{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.banner h2{font:800 30px/1.1 var(--f-display);font-stretch:condensed;text-transform:uppercase;margin:6px 0 4px}
.banner.rapid h2{color:var(--rapid)} .banner.evac h2{color:var(--evac)} .banner.field h2{color:var(--field)}
.banner p{margin:0;max-width:60ch}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.card>summary::-webkit-details-marker{display:none}
.card>summary h3{margin:0;font:700 20px/1.2 var(--f-display);font-stretch:condensed;min-width:0}
.card .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.card.rapid{border-left:5px solid var(--rapid)} .card.evac{border-left:5px solid var(--evac)} .card.field{border-left:5px solid var(--field)}
.pill{flex:none;font:700 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:6px;white-space:nowrap}
.pill.rapid{background:var(--rapid);color:var(--surface)}
.pill.evac{background:var(--evac);color:var(--surface)}
.pill.field{background:var(--field);color:var(--surface)}
.lede{margin:12px 0 0;max-width:62ch}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.sec{margin-top:16px}
.sec ol,.sec ul{margin:0;padding-left:1.4em;display:grid;gap:7px;max-width:64ch}
.sec ol li::marker{font:700 14px var(--f-mono);color:var(--muted)}
.sec.ev ul li::marker{color:var(--evac)}
.sec.av ul li::marker{color:var(--rapid)}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.copybox{width:100%;min-height:160px;margin-top:10px;font:13px/1.45 var(--f-mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--on-btn);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}

/* library */
.search{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.search:focus{border-color:var(--ink);outline:none}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.cats button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink)}
.cats button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.group{margin-bottom:22px}
.group h2{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.row b{font:700 18px/1.25 var(--f-display);font-stretch:condensed;min-width:0}
.row span.s{grid-column:1/-1;color:var(--muted);font-size:14px}
.row:hover b{text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted)}
.disc{margin-top:28px;font-size:13px;color:var(--muted);max-width:60ch}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetbar{position:sticky;top:0;background:var(--band);color:var(--on-band);padding-top:env(safe-area-inset-top,0px);z-index:2}
.sheetbar .gut{padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheetbar button{background:transparent;border:2px solid var(--on-band);color:var(--on-band);border-radius:10px;padding:8px 14px;font-weight:700}
.sheet .gut.content{padding-block:22px calc(56px + env(safe-area-inset-bottom,0px))}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet h2{font:800 32px/1.1 var(--f-display);font-stretch:condensed;margin:8px 0 10px;text-wrap:balance}
@media (prefers-reduced-motion:no-preference){.q,.res{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:420px){.q h2{font-size:24px}.brand b{font-size:20px}.tabs button{padding:8px 11px}}
</style>

</head>
<body>
<header class="top">
  <div class="gut">
    <div class="brand"><b>Backcountry Triage</b><span>Wilderness first aid field guide · <span id="ver"></span></span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-assess" aria-selected="true">Assess</button>
      <button role="tab" id="tab-lib" aria-selected="false">Conditions</button>
    </div>
  </div>
</header>
<main>
  <div class="gut" id="view"></div>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheetbar"><div class="gut"><button id="sheet-close">← Back</button><span class="eyebrow" style="color:inherit;opacity:.75">Field reference</span></div></div>
  <div class="gut content" id="sheet-body"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CONDS = [
/* ---------- ASSESSMENT ---------- */
{id:"scene",c:"assess",u:null,n:"Scene safety",
 s:"Your safety comes first. A rescuer who gets hurt doubles the emergency.",
 lab:{tx:"Steps"},
 tx:["Stop and look for hazards still in play: rockfall, avalanche, lightning, moving water, falling trees, animals, traffic.",
  "Don't enter swiftwater or avalanche terrain without training and gear. Reach, throw, row: don't go.",
  "Move the person only if staying put is more dangerous. Keep head, neck, and spine aligned while you do.",
  "Put on gloves, or use a plastic bag as a barrier, before touching blood or body fluids.",
  "Call for help early: 911 if there's signal, or the SOS on a satellite messenger."]},
{id:"primary",c:"assess",u:null,n:"Primary assessment (ABCDE)",
 s:"A fast check for immediate threats to life, done before anything else.",
 lab:{tx:"In order"},
 tx:["Airway: is it open and clear? Tilt head, lift chin. If spine injury is possible, use a jaw thrust.",
  "Breathing: look, listen, and feel for up to 10 seconds. Gasping is not normal breathing.",
  "Circulation: find and stop severe bleeding. Check for a pulse at the wrist or neck.",
  "Disability: was there a mechanism for spine injury? Note responsiveness on the AVPU scale (Alert, responds to Voice, responds to Pain, Unresponsive).",
  "Environment and expose: protect from cold, heat, and the ground. Expose injuries enough to see them."]},
{id:"vitals",c:"assess",u:null,n:"Vital signs and SOAP note",
 s:"Record a baseline, then repeat every 15 minutes for serious problems. Trends matter more than single numbers.",
 lab:{sg:"Vital signs",tx:"SOAP note"},
 sg:["Level of responsiveness (AVPU), and whether they know who they are, where they are, when it is, and what happened.",
  "Heart rate: normal adult 50–100 per minute. Note strong or weak, regular or irregular.",
  "Respiratory rate: normal adult 12–20 per minute. Note easy or labored.",
  "Skin: color, temperature, moisture (pink, warm, dry is normal).",
  "Pupils: equal, round, react to light."],
 tx:["S, Subjective: age, sex, chief complaint, what happened. SAMPLE history: Symptoms, Allergies, Medications, Past history, Last intake and output, Events leading up.",
  "O, Objective: head-to-toe exam findings and vital signs with times.",
  "A, Assessment: your problem list.",
  "P, Plan: treatment for each problem, evacuation plan, and what to watch for."]},
{id:"evacuation",c:"assess",u:null,n:"Evacuation and calling for help",
 s:"Decide how fast this person needs medical care, and what you'll tell rescuers.",
 lab:{sg:"Evacuation levels",tx:"When you call or send for help",av:"Group management"},
 sg:["Rapid evacuation: life threat or getting worse. Fastest means available, including helicopter.",
  "Evacuate: needs medical care within hours to a day. Walking out is fine if the person can do it safely. A carried litter covers about 1 mile per hour and takes 15–20 people.",
  "Field care: treat and monitor. Continue or modify the trip, and evacuate if anything worsens."],
 tx:["Location: GPS coordinates (lat/long or UTM) and a description of the terrain.",
  "Number of patients, age and sex, the problem, and when it happened.",
  "Vital signs and how they're changing.",
  "Treatment given so far and what supplies you have.",
  "Weather, daylight, and any spot where a helicopter could land.",
  "Your plan: staying put or moving, and how rescuers will find you."],
 av:["Never leave a patient alone if you can avoid it.",
  "Without communication, send at least two people for help, with a written SOAP note and location.",
  "Don't split the group without a clear plan for where and when to meet."]},
{id:"altered",c:"assess",u:"rapid",n:"Altered or unresponsive (cause unclear)",
 s:"Confused, drowsy, combative, or not responding. Treat as a life threat until you find the cause.",
 tx:["Check airway and breathing. Keep the airway open.",
  "No spine concern: place in the recovery position (on their side). Spine concern: keep aligned and log-roll to the side if they vomit.",
  "Insulate from the ground and protect from weather.",
  "Look for a cause: head injury, hypothermia, heat stroke, low blood sugar, seizure, stroke, hyponatremia, altitude (HACE), carbon monoxide, lightning, drugs or alcohol.",
  "Diabetic and able to swallow: give sugar. Unable to swallow: rub sugar paste or glucose gel inside the cheek.",
  "Nothing by mouth unless they're alert enough to swallow safely.",
  "Record AVPU and vital signs every 15 minutes."],
 ev:["Always. Rapid evacuation."],
 rel:["tbi","hypo-severe","heatstroke","hypoglycemia","seizure","stroke","hace","hyponatremia","co"]},

/* ---------- LIFE THREATS ---------- */
{id:"cpr",c:"life",u:"rapid",n:"CPR: adult or teen",
 s:"Unresponsive and not breathing normally. Start CPR and send for help now.",
 sg:["Unresponsive.","No breathing, or only occasional gasps.","No pulse (don't spend more than 10 seconds checking, or 60 seconds if hypothermic)."],
 tx:["Send someone to call 911 or trigger SOS now. Alone with a phone: call first, then start.",
  "Lay the person on their back on a firm surface.",
  "Compressions: heel of hand on the lower half of the breastbone, other hand on top. Push 2–2.4 in (5–6 cm) deep at 100–120 per minute and let the chest fully recoil. Don't stop to remove a heavy jacket; push harder instead.",
  "After 30 compressions, open the airway and give 2 breaths of about 1 second each, just enough to make the chest rise. Keep going at 30:2 and minimize pauses.",
  "If a breath doesn't go in: retilt the head and try once more. Before the next breaths, look in the mouth and remove anything you can see.",
  "Unable or unwilling to give breaths: compression-only CPR is far better than nothing. Breaths matter most for drowning, choking, anaphylaxis, and children.",
  "Drowning or lightning: start with 5 rescue breaths. Breathing failure is usually the cause.",
  "Possible opioid overdose: give naloxone as soon as it's available, without stopping CPR for long.",
  "Visibly pregnant: raise the right hip 3–4 in (7–10 cm) with padding to take weight off the major vessels.",
  "Vomiting: roll them toward you, wipe the mouth, roll back, continue.",
  "Hypothermia: check breathing and pulse for a full 60 seconds before starting. CPR can stop a very cold heart that is still beating slowly, so be sure first, and handle gently.",
  "Use an AED if one is available."],
 ev:["Rapid evacuation."],
 av:["Don't start CPR with obvious signs of death: injuries incompatible with life, stiffening (rigor mortis), dark blood pooling in the lowest parts of the body, or a cool body with no cold exposure.",
  "You may stop after 30 minutes if the person is not hypothermic and advanced care is more than an hour away. Also stop if you're exhausted, the scene becomes unsafe, others with equal or more training take over, or they show clear signs of life.",
  "Prolonged CPR is worth it in hypothermia, lightning strike, and cold-water drowning."],
 lab:{av:"Starting and stopping"},
 rel:["cpr-child","cpr-baby","opioid","drowning","lightning","hypo-severe"]},
{id:"cpr-child",c:"life",u:"rapid",n:"CPR: child (1 year to puberty)",
 s:"Children usually arrest from breathing problems, so rescue breaths matter. Same 30:2 rhythm as adults, with gentler compressions.",
 sg:["Unresponsive and not breathing, or only gasping."],
 tx:["Send someone to call 911 or trigger SOS. Alone: do 2 minutes (5 cycles of 30:2) first, then call, bringing the child with you if you can.",
  "Compressions: one or two hands on the lower half of the breastbone. Push at least one-third of the chest's depth (about 2 in / 5 cm) at 100–120 per minute, letting the chest fully recoil.",
  "Breaths: tilt the head, lift the chin, and give 2 gentle breaths of about 1 second, just enough to see the chest start to rise.",
  "Continue 30 compressions and 2 breaths. Look in the mouth before breaths if they don't go in, and remove anything you can see.",
  "Use an AED with child pads if available; adult pads are acceptable if they don't touch each other.",
  "Drowning: start with 5 rescue breaths."],
 ev:["Rapid evacuation."],
 rel:["cpr","cpr-baby","choking"]},
{id:"cpr-baby",c:"life",u:"rapid",n:"CPR: baby (under 1 year)",
 s:"Two fingers or two thumbs on the chest, small puffs covering the mouth and nose.",
 sg:["Unresponsive (no reaction to a tap on the foot or your voice) and not breathing normally."],
 tx:["Send someone to call 911 or trigger SOS. Alone: do 2 minutes of CPR first, then call, carrying the baby with you.",
  "Lay the baby on a firm, flat surface. Keep the head in a neutral position; tilting it back too far can block the airway.",
  "Compressions: two fingers just below the nipple line on the middle of the chest, or both thumbs there with your hands wrapped around the chest. Push at least one-third of the chest's depth (about 1.5 in / 4 cm) at 100–120 per minute.",
  "Breaths: seal your mouth over the baby's mouth and nose and give 2 gentle puffs of about 1 second, just enough to see the chest rise.",
  "Continue 30 compressions and 2 breaths. Look in the mouth before breaths and remove anything you can see; never sweep blindly.",
  "Drowning: start with 5 rescue breaths."],
 ev:["Rapid evacuation."],
 rel:["choking-baby","cpr-child"]},
{id:"choking",c:"life",u:"rapid",n:"Choking: adult or child over 1 year",
 s:"If they can cough, let them cough. If they can't breathe, speak, or cough, act now.",
 sg:["Sudden inability to speak, breathe, or cough, often while eating.","High-pitched squeaking, hands at the throat, panicked look.","Color change in lips and face, then loss of consciousness."],
 tx:["Partial choking (coughing, can speak): have them sit up and cough hard. Don't hit their back. Stay with them.",
  "Complete choking: stand behind them, lean them forward, and give up to 5 firm back blows between the shoulder blades with the heel of your hand.",
  "Then up to 5 abdominal thrusts: fist just above the navel, other hand over it, quick inward and upward pulls.",
  "Pregnant, very large, or you can't reach around: use chest thrusts instead, fist in the middle of the chest, pulling straight back.",
  "Small child: kneel to their height, bend them over your raised knee for back blows, then abdominal or chest thrusts.",
  "Alternate 5 and 5 until the object comes out, they can breathe or cough, or they become unresponsive.",
  "Becomes unresponsive: lower them to the ground and start CPR with compressions. Look in the mouth before each set of breaths and remove anything you can see.",
  "Choking alone: thrust your upper belly hard over a rounded, solid edge such as a log, boulder, or pack frame."],
 ev:["Anyone who needed back blows or thrusts should be checked by a doctor; the thrusts themselves can cause injury.",
  "Object not cleared, any loss of consciousness, or ongoing breathing trouble: rapid evacuation.",
  "After partial choking, watch for several hours for breathing problems."],
 av:["Blind finger sweeps can push the object deeper."],
 rel:["choking-baby","cpr","cpr-child"]},
{id:"choking-baby",c:"life",u:"rapid",n:"Choking: baby (under 1 year)",
 s:"Back blows and chest thrusts with the baby head-down along your forearm. Never abdominal thrusts.",
 sg:["Can't cry, cough, or breathe; weak or silent cough; high-pitched noises.","Color change in lips and face."],
 tx:["Sit or kneel. Lay the baby face-down along your forearm, holding the jaw in your hand, head lower than the body, forearm resting on your thigh.",
  "Give 5 firm back blows between the shoulder blades with the heel of your hand.",
  "Turn the baby face-up along your other forearm, supporting the head, still head-down.",
  "Give 5 chest thrusts: two fingers just below the nipple line, pushing down about one-third of the chest's depth.",
  "Repeat 5 back blows and 5 chest thrusts until the object comes out or the baby cries, coughs, or breathes.",
  "Becomes unresponsive: start baby CPR. Look in the mouth before breaths and remove anything you can see."],
 ev:["Always have the baby checked by a doctor after choking that needed back blows or thrusts.","Not cleared, or any unresponsiveness: rapid evacuation."],
 av:["No abdominal thrusts on a baby.","No blind finger sweeps."],
 rel:["cpr-baby","choking"]},
{id:"bleeding",c:"life",u:"rapid",n:"Severe bleeding",
 s:"Spurting, steady flow, or blood soaking through. If firm pressure doesn't control a limb bleed right away, use a tourniquet.",
 sg:["Spurting or steady flow.","Blood pooling on the ground or soaking through clothing and dressings.","Partial or complete amputation.","Signs of shock: pale, cool, clammy skin, fast pulse, confusion."],
 tx:["Put on gloves or use a plastic bag as a barrier. Have the person sit or lie down.",
  "Expose the wound and press hard directly on the bleeding with a gloved hand and gauze or cloth. Enough pressure to hurt is normal.",
  "Arm or leg bleeding that pressure doesn't control: apply a tourniquet immediately, 2–3 in (5–7 cm) above the wound, not over a joint. If you can't see all the wounds, go high and tight on the limb.",
  "Pull out all slack before turning the windlass. Tighten until the bleeding stops and the pulse below it is gone. A correct tourniquet hurts. Write the time on it or on the skin.",
  "If one tourniquet doesn't stop it, add a second just above the first.",
  "Neck, armpit, or groin: pack gauze tightly into the wound onto the bleeding source until no more fits, mound more on top, and hold hard pressure for at least 3 minutes. Then wrap a pressure bandage.",
  "Amputated part: wrap in moist clean gauze, seal in a plastic bag, keep it cool but not frozen, and send it with the patient.",
  "Treat for shock: lie flat, insulate from the ground, keep warm. Splint injured limbs."],
 ev:["Any bleeding that needed a tourniquet or wound packing, or with signs of shock: rapid evacuation."],
 av:["No partial tourniquets. One that's too loose stops blood leaving the limb but not entering it, which makes bleeding worse.",
  "Don't loosen a tourniquet to check it. Leave it on during short evacuations and while the person is in shock.",
  "Converting to a pressure dressing is an option only within 2 hours of applying it, when care is more than 2 hours away, the person isn't in shock, bleeding is controlled, it isn't an amputation, and you can watch the limb continuously. Pack and wrap the wound first, release the tourniquet but leave it loosely in place, and retighten it if bleeding returns.",
  "Improvised tourniquets often fail. Carry a manufactured one if you expect to need it."],
 lab:{av:"Tourniquet rules"},
 rel:["shock","wound"]},
{id:"shock",c:"life",u:"rapid",n:"Shock",
 s:"Not enough blood flow to the body's tissues. Find and treat the cause, keep them flat and warm.",
 sg:["Early: anxiety, restlessness, thirst, nausea, fast pulse, pale, cool, clammy skin.",
  "Late: confusion, decreasing responsiveness, fast weak pulse, fast shallow breathing."],
 tx:["Treat the cause: stop bleeding, epinephrine for anaphylaxis, cooling for heat stroke, a pelvic wrap for a pelvic injury, splints for fractures.",
  "Lay them flat. Insulate from the ground and put them in a hypothermia wrap.",
  "Reassure them honestly and keep them calm and still.",
  "Small sips of water only during long-term care, if they're alert, can protect their own airway, and it doesn't make them nauseated. Otherwise nothing by mouth.",
  "Check vital signs every 15 minutes. Shock gets worse over time, so watch the trend."],
 ev:["Always. Rapid evacuation, carried. Don't let them walk out."],
 rel:["bleeding","anaphylaxis","abd-trauma","fracture"]},
{id:"anaphylaxis",c:"life",u:"rapid",n:"Anaphylaxis (severe allergic reaction)",
 s:"A body-wide allergic reaction that can close the airway or drop blood pressure. Give epinephrine immediately.",
 sg:["After a sting, food, medication, or other trigger: skin or mouth symptoms (hives, swelling of lips, tongue, or throat) that come on fast together with trouble breathing, faintness, or persistent vomiting.",
  "Or sudden trouble breathing, severe wheezing, throat tightness, or signs of shock, even without any skin signs.",
  "Hoarse voice, trouble swallowing, stomach cramps, a sense of doom."],
 tx:["Give epinephrine into the middle of the outer thigh right away. It can go through clothing. Use the person's auto-injector per its instructions. Child devices are 0.15 mg (up to about 66 lb / 30 kg); adult devices are 0.3 mg. Responders working under protocols may give 0.3–0.5 mg intramuscularly to adults.",
  "Hold the device in place as directed, then rub the site for about 30 seconds. Keep the used injector to show medical staff.",
  "Write down the time. If symptoms persist or return, give another dose after 5–15 minutes, in the other thigh. Most people respond to 1 or 2 doses.",
  "Position: sitting up if breathing is hard, lying flat if showing shock (don't let them stand up suddenly), on their side if vomiting.",
  "Once they can swallow and protect their airway, give an oral antihistamine such as diphenhydramine per package directions.",
  "Reassess often. Reactions can return up to 24 hours later, so track how many epinephrine doses you have left."],
 ev:["Suspected anaphylaxis, or anyone who needed epinephrine: rapid evacuation, even if they feel better."],
 av:["Don't wait to see if it gets worse before giving epinephrine.","Antihistamines alone do not treat anaphylaxis.",
  "Giving your own epinephrine to someone else may require local laws or physician protocols. Sort this out before a trip, especially if you lead clients."],
 rel:["sting","allergic-mild"]},
{id:"breathing-unclear",c:"life",u:"rapid",n:"Breathing difficulty (cause unclear)",
 s:"Struggling to breathe without an obvious cause. Treat as serious until you know why.",
 tx:["Sit them upright or in whatever position is most comfortable. Loosen tight clothing.",
  "Coach slow, steady breaths.",
  "Look for a cause: anaphylaxis, asthma, chest injury, heart attack, HAPE at altitude, water inhaled.",
  "At altitude, descend.",
  "Check vital signs every 15 minutes."],
 ev:["Rapid evacuation."],
 av:["Don't assume panic or hyperventilation until every other cause is ruled out."],
 rel:["anaphylaxis","asthma","chest-serious","cardiac","hape","drowning"]},

/* ---------- INJURIES ---------- */
{id:"tbi",c:"trauma",u:"rapid",n:"Serious head injury",
 s:"Head injury with signs the brain is affected. Protect the airway and spine, and get out fast.",
 sg:["Any loss of consciousness, or any change in responsiveness.","Confusion, irritability, combativeness, or repeating the same questions.","Repeated vomiting, worsening headache, seizure.",
  "Signs of rising pressure in the skull: unequal pupils, bruising behind the ears or around both eyes, abnormal posturing, irregular breathing, slowing pulse.","Clear fluid or blood from ears or nose."],
 tx:["Restrict spine motion. Keep head and neck in line with the body.",
  "Protect the airway aggressively. Expect vomiting and seizures; log-roll to the side to clear the airway.",
  "Assist breathing if it's inadequate. Low oxygen worsens brain injury.",
  "Signs of shock: keep the head level with the body, flat or on their side.",
  "Signs of rising pressure in the skull: raise the head and torso 15–30° while keeping the spine aligned. Loosen anything tight around the neck, and protect from light and noise.",
  "Record responsiveness, pupils, and vital signs every 15 minutes."],
 ev:["Rapid evacuation. Don't wait for vomiting or seizures to start."],
 rel:["concussion","spine","seizure","altered"]},
{id:"concussion",c:"trauma",u:"field",n:"Minor head injury (concussion)",
 s:"Dazed or headachy after a knock, with symptoms that ease over time. Watch closely for 24 hours.",
 sg:["Dazed, foggy, or slow to answer at first.","Mild headache, dizziness, nausea, or fatigue.","Sensitive to light or noise."],
 tx:["Stop the activity and rest.",
  "Check them every hour for 24 hours, including waking them during the night, for worsening symptoms or confusion. Most serious signs appear within 24 hours.",
  "Acetaminophen for headache.",
  "Avoid risky activity (climbing, riding, skiing) until symptom-free."],
 ev:["Any loss of consciousness or change in responsiveness.","Takes blood thinners (warfarin and similar).",
  "Symptoms getting worse, or any red flag from Serious head injury.","Consider evacuating anyway if you're responsible for them as a guide or leader."],
 rel:["tbi"]},
{id:"spine",c:"trauma",u:"rapid",n:"Possible spinal injury",
 s:"A mechanism that could injure the spine, plus findings you can't rule out. Keep them aligned and still.",
 sg:["Mechanism: high fall, high-speed impact, diving, being thrown, a blow to the top of the head. Mechanism alone doesn't prove injury, but should raise suspicion.",
  "Pain or tenderness along the middle of the neck or back.","Numbness, tingling, or weakness in arms or legs, or unequal grip or foot strength.",
  "Exam isn't reliable: not fully oriented, knocked out, intoxicated, extremely upset, a language barrier, or another painful injury distracting them."],
 tx:["Hold the head in line with the body, or coach the person to keep still. Do this alongside the primary assessment, not instead of it.",
  "Bring the head to a neutral position gently, one direction at a time. Stop if pain increases or you feel resistance, and support it where it is.",
  "Pad around the head, and use a collar (SAM splint, rolled jacket) if you have one, while still holding the head. Collars can cause harm, so check airway and comfort.",
  "Keep head, neck, and torso aligned on their back, on their back with head raised 15–45°, or on their side. A vacuum mattress is best; avoid rigid backboards except for short moves.",
  "Move by lifting and sliding with several helpers. Limit log rolls.",
  "Check circulation, sensation, and motion in all four limbs and record it.",
  "Stop spine precautions only if the person is fully reliable and has no midline pain or tenderness, no deformity, and normal feeling and strength in all four limbs."],
 ev:["Evacuate anyone who still needs spine precautions. A litter is the safer choice unless it puts patient or rescuers at greater risk.",
  "A reliable person with no numbness or weakness may walk out with help, weighing that risk against a long carry."],
 av:["Spine precautions are not needed for a stab or gunshot wound alone, without blunt trauma."],
 lab:{av:"Note"},
 rel:["tbi"]},
{id:"crush",c:"trauma",u:"rapid",n:"Crush injury and entrapment",
 s:"A body part trapped under heavy weight. Long entrapment can cause muscle breakdown and dangerous shifts in blood chemistry once it's released.",
 sg:["Pinned under a rock, log, vehicle, or debris.","Pain, swelling, bruising, deformity; numb, pale, or cold beyond the crush.",
  "After release: rapid swelling, shock, irregular pulse, dark urine (rhabdomyolysis)."],
 tx:["Make the scene safe. Stabilize the load so it can't shift onto the patient or rescuers.",
  "Immediately free the head, neck, chest, or belly, and anything restricting breathing.",
  "Front-country guides leave a trapped limb for EMS. In the backcountry help may be hours away, so free it as soon as it's safe, with a plan ready to treat bleeding and shock.",
  "Have a tourniquet ready before release; bleeding can start once pressure comes off.",
  "Once free: control bleeding, treat for shock, splint fractures, keep warm, and check circulation, sensation, and motion.",
  "If alert and able to swallow, give fluids to help protect the kidneys.",
  "Watch for dark urine, little urine, and an irregular pulse."],
 ev:["Limb trapped more than about an hour, any crush of the torso, signs of shock, or dark urine: rapid evacuation.","All other crush injuries: evacuate for assessment."],
 rel:["rhabdo","bleeding","shock","fracture"]},
{id:"chest-serious",c:"trauma",u:"rapid",n:"Serious chest injury",
 s:"Chest trauma affecting breathing. Can become fatal quickly, and the full injury is often hidden at first.",
 sg:["Breathing getting harder, fast heart rate.","Part of the chest moving the wrong way when breathing (flail segment: several ribs broken in more than one place).",
  "Open wound that bubbles or sucks air.","Coughing blood or pink sputum.","Signs of shock."],
 tx:["Position of comfort, or lying on the injured side if they can tolerate it.",
  "Flail segment: tape a bulky pad over it to stabilize.",
  "Open chest wound: cover it with a gloved hand right away, then a vented chest seal or a plastic dressing taped on three sides. If breathing worsens, lift one edge to let air escape.",
  "Treat for shock, keep warm, and monitor breathing closely."],
 ev:["Rapid evacuation."],
 rel:["rib","shock"]},
{id:"rib",c:"trauma",u:"evac",n:"Rib injury",
 s:"Painful ribs after a blow or fall, with breathing that stays comfortable.",
 sg:["Pain at one spot on the ribs, worse with breathing, coughing, laughing, or moving.","Tenderness or a grating feeling when pressed.","Holding the arm against that side."],
 tx:["Position of comfort.","Sling and support the arm on the injured side.",
  "Take deep breaths and cough every hour to prevent pneumonia, even though it hurts.",
  "Pain medication per label helps them breathe deeper."],
 ev:["Walk out if breathing stays easy.","Rapid evacuation if breathing gets harder: see Serious chest injury."],
 av:["Don't tape or wrap the chest. It rarely helps and can lead to pneumonia."],
 rel:["chest-serious"]},
{id:"abd-trauma",c:"trauma",u:"rapid",n:"Abdominal or pelvic injury",
 s:"A blow to the belly or pelvis can cause hidden bleeding. Watch for shock.",
 sg:["Pain, tenderness, bruising, or a rigid belly after impact.","Pelvis: pain in hips or groin, or when gently pressing the hip bones inward (check once only).","Signs of shock."],
 tx:["No spine concern: lie flat with knees bent.",
  "Suspected pelvic fracture: wrap a sheet or jacket tightly around the hips at the level of the hip joints, and tie the knees and ankles together.",
  "Keep warm. Nothing by mouth. Treat for shock and check vital signs every 15 minutes."],
 ev:["Rapid evacuation."],
 av:["Don't rock or repeatedly press the pelvis."],
 rel:["shock"]},
{id:"fracture",c:"trauma",u:"evac",n:"Broken bone (closed fracture)",
 s:"Pain, swelling, or deformity over a bone, with the skin intact. Splint it.",
 sg:["Pain directly over a bone, swelling, bruising.","Deformity, angulation, or grating.","Can't use the limb or bear weight."],
 tx:["Check circulation, sensation, and motion (CSM) beyond the injury.",
  "Realign a badly angled long bone only if all are true: care is more than 2 hours away, the limb is unstable and straightens easily, the angle prevents a stable splint, and CSM is reduced. Use gentle, steady pull in line. Stop at resistance or a sudden jump in pain.",
  "Never force a forearm or wrist fracture straight.",
  "Splint the joints above and below a broken bone. Keep it simple, pad well, fill gaps, and keep hands and feet in a natural resting position.",
  "Recheck CSM after splinting and regularly. Loosen if fingers or toes go numb, pale, or cold.",
  "Cold and elevation for swelling.",
  "Thigh (femur) fracture: up to 2 liters of blood can collect in the thigh. Hold the leg still, splint it in place without pulling traction, and treat for shock. Improvised traction splints can cause harm."],
 ev:["All suspected fractures.","Rapid evacuation for femur or pelvis fractures, reduced CSM, or signs of shock."],
 rel:["open-fx","sprain","shock"]},
{id:"overuse",c:"trauma",u:"field",n:"Tendinitis and overuse injuries",
 s:"Gradual pain from repeated motion: Achilles, knee, shin, foot, wrist, or shoulder. Usually manageable by reducing load and fixing the cause.",
 sg:["Pain that builds over hours or days with a repeated activity, better with rest.","Tenderness and mild swelling along a tendon; sometimes a creaking feel when it moves.",
  "Common: Achilles (heel cord), front of knee or outside of knee (IT band), shins (shin splints), heel and arch (plantar fasciitis), wrist and forearm (paddling, poles), shoulder.",
  "Warning signs of something worse: pinpoint pain on bone (stress fracture), a sudden pop in the heel cord with weakness pushing off (Achilles rupture)."],
 tx:["Reduce the load: shorter days, lighter pack, more breaks, trekking poles, smaller steps on descents.",
  "Fix the cause: loosen or re-lace boots (skip the top hooks for Achilles pain), add a heel lift or padding, adjust paddle grip or bike fit, swap tasks.",
  "Cold for 10–20 minutes after activity. Ibuprofen per label.",
  "Tape or wrap for support. Gentle stretching once pain allows.",
  "Muscle cramps: stretch and massage the muscle, drink fluids with electrolytes."],
 ev:["Pinpoint bone pain, especially in the foot or shin (possible stress fracture).","Suspected Achilles rupture: splint with the toes pointed and evacuate.","Pain that keeps worsening despite reduced load, or they can't continue safely."],
 rel:["sprain","fracture"]},
{id:"back",c:"trauma",u:"field",n:"Back pain and strain",
 s:"Most back pain on a trip is muscle strain from lifting or carrying. A few red flags need evacuation.",
 lab:{sg:"Red flags"},
 sg:["After a fall or significant impact: treat as Possible spinal injury.","Numbness or weakness in the legs.",
  "Numbness in the groin or inner thighs, or new loss of bladder or bowel control: rapid evacuation.","Fever, or pain with burning urination or in the side (kidney).","Severe pain that doesn't ease at all with rest or position changes."],
 tx:["Without red flags: keep gently moving rather than lying still for long periods.",
  "Ibuprofen or acetaminophen per label. Cold in the first day or two, then warmth.",
  "Lighten and repack the load: heavy items close to the back, hip belt snug so the hips carry the weight.",
  "Lift with legs, avoid twisting with a load, and share heavy carries."],
 ev:["Any red flag.","Can't carry a pack or walk after 24 hours of rest and treatment."],
 rel:["spine","urinary"]},
{id:"open-fx",c:"trauma",u:"rapid",n:"Open fracture",
 s:"A broken bone with a wound over it. High infection risk.",
 sg:["Bone end visible, or a wound near a suspected fracture. Bone may have pulled back inside."],
 tx:["Control bleeding.",
  "Irrigate early with 1–3 liters of drinkable water under pressure (an irrigation syringe is ideal).",
  "Irrigate before attempting any realignment.",
  "Cover wound and any exposed bone with moist sterile dressings. Change every 24 hours.",
  "Splint as for a closed fracture, leaving a window to check the wound."],
 ev:["Rapid evacuation. Needs antibiotics and surgery."],
 rel:["fracture","wound"]},
{id:"disloc",c:"trauma",u:"evac",n:"Dislocation",
 s:"A joint out of place. Reduce only when strict conditions are met; otherwise splint and evacuate.",
 sg:["Obvious joint deformity, severe pain, loss of motion.",
  "Shoulder (front, over 90% of cases): arm held down and away from the body, squared-off shoulder, can't bring elbow to waist.","Kneecap: shifted to the outside, knee bent, won't straighten.","Finger: crooked and locked at a joint."],
 tx:["Check CSM beyond the joint.",
  "Consider reduction only if: care is more than 2 hours away, the mechanism and exam don't suggest a fracture, and circulation, sensation, or motion beyond the joint is affected. Your training, protocols, and relationship to the patient also matter.",
  "Shoulder, seated: the person hugs their knees to their chest and slowly leans back, letting body weight relax the muscles until it slips in.",
  "Shoulder, hanging: lie them face-down on a high surface with the arm hanging. Tie 5–10 lb (2–5 kg) to the wrist with padding (1 liter of water is about 2 lb). It can take up to 45 minutes.",
  "Kneecap: lying on their back with the leg raised, slowly straighten the knee while guiding the kneecap back to the middle.",
  "Finger: pull gently on the tip while pushing the dislocated end back. Only the two joints nearest the fingertip. Then buddy-tape for a few days.",
  "Stop if pain rises sharply or it hasn't worked within an hour. Splint in the most comfortable position and keep checking CSM.",
  "After reduction, sling or splint and recheck CSM."],
 ev:["All dislocations, whether or not they were reduced.","Rapid evacuation if CSM stays reduced."],
 av:["Don't reduce a shoulder hurt by a direct blow or major force (a fracture may be present), or one dislocated toward the back.",
  "Don't reduce thumb joints, the finger joint at the knuckle, or open dislocations."],
 rel:["fracture"]},
{id:"sprain",c:"trauma",u:"field",n:"Sprain or strain",
 s:"Joint or muscle injury that can still bear weight without deformity.",
 sg:["Pain and swelling at a joint or muscle, bruising, maybe a pop at injury.","Can still use it or walk on it.","No deformity, no pain directly on bone."],
 tx:["RICES: Rest for 24–48 hours if possible, until it bears weight without pain and swelling is down.",
  "Ice 10 minutes on, 10 off, for the first 24–48 hours. Never put ice directly on skin.",
  "Ibuprofen per label, and acetaminophen alongside it for more pain relief.",
  "Compression wrap, snug but not tight, starting farthest from the heart.","Elevate above the heart.",
  "Stabilize with tape or a splint once they can bear weight. Trekking poles help walking out."],
 ev:["Can't move on their own for more than 24 hours, or still can't bear weight.",
  "Pain directly on bone, unstable joint, or the limb doesn't work: treat as a fracture."],
 rel:["fracture"]},
{id:"wound",c:"trauma",u:"field",n:"Cuts, scrapes, and wounds",
 s:"Stop the bleeding, clean thoroughly, close only low-risk wounds, and watch for infection.",
 lab:{sg:"High-risk wounds (leave open, evacuate)"},
 sg:["Bites, deep punctures, crush injuries.","Grossly dirty wounds.","Gaping wounds, or exposed bone, tendon, joint, fat, or muscle.","Any wound in someone with diabetes or a weak immune system."],
 tx:["Stop significant bleeding with direct pressure. Light bleeding helps flush the wound.",
  "Irrigate with at least 1 liter of drinkable water under pressure from an irrigation syringe, as soon as practical.",
  "Use plain water. Soap, iodine, peroxide, and similar additives damage tissue; the exception is a possible rabies exposure.",
  "Pick out debris with tweezers or gauze, and look closely for anything left.",
  "Close only small, clean, low-risk wounds with smooth edges: tape strips or tissue adhesive, starting in the middle. Never leave a closed wound unchecked.",
  "Leave high-risk wounds open. Pack large ones with moist sterile gauze and change daily.",
  "Cover with a slightly moist sterile dressing and a loose bandage. Antibiotic ointment is optional.",
  "Infected small wound: clean it, warm soaks 20 minutes three times a day, and immobilize."],
 ev:["Fever, chills, weakness, or signs of sepsis (confusion, fast breathing, fast pulse): rapid evacuation.",
  "Infection spreading beyond the wound: redness, warmth, swelling, red streaks.","High-risk wounds, impaled objects, or wounds not improving."],
 rel:["bleeding","animal-bite"]},
{id:"splinter",c:"trauma",u:"field",n:"Splinters and fishhooks",
 s:"Remove what you can grasp, clean well, and watch for infection.",
 tx:["Splinter: grasp the exposed end with tweezers and pull it out along the angle it went in. Wash with clean water and cover.",
  "Splinter completely under the skin: leave it unless it's easy to reach; it may work out on its own.",
  "Fishhook in the skin: press down on the shank and yank the line sharply along the hook's path (string-yank), or push the barb through the skin, cut it off, and back the hook out.",
  "Clean the wound well afterward and watch it for infection.",
  "Prevent: gloves for woodwork and fishing; tetanus vaccination up to date."],
 ev:["Hook or splinter in or near the eye, deep in a joint, or that won't come out.","Signs of infection, or no tetanus shot in 10 years (5 for dirty wounds)."],
 av:["Never try to remove a fishhook from near the eye."],
 rel:["wound","impaled"]},
{id:"bruise",c:"trauma",u:"field",n:"Bruises and contusions",
 s:"Bruising without a break in the skin. Can swell far more than expected and can mimic a fracture.",
 sg:["Pain, swelling, and discoloration after a direct blow.","A bruise near a joint can cause a lot of joint swelling."],
 tx:["First 48 hours: rest, cold for 20–30 minutes every 2 hours (never directly on skin), compression, and elevation.",
  "After 48–72 hours: warm packs for 15–20 minutes 2–3 times a day, compression, and pain-free activity.",
  "Ibuprofen per label."],
 ev:["Pain that could be a fracture: treat as a fracture.","Large bruising after a big impact, especially to the thigh, torso, or belly (hidden bleeding).","Bruising on someone taking blood thinners after any significant blow."],
 rel:["fracture","abd-trauma"]},
{id:"impaled",c:"trauma",u:"rapid",n:"Impaled object",
 s:"Leave it in and stabilize it. Removing it can cause major bleeding.",
 tx:["Pad bulky material around the object and bandage it in place so it can't move.",
  "Shorten it only if needed for transport, and only without moving it.",
  "Remove only if it blocks the airway, prevents CPR, or is small and in the skin (splinter, fishhook).",
  "Fishhook in the skin: push the barb through and cut it, or use the string-yank method if trained.",
  "Object in the eye: never remove. Cover both eyes loosely so they don't move."],
 ev:["Rapid evacuation, unless small, shallow, and removed easily."],
 rel:["wound","eye"]},
{id:"burn-minor",c:"trauma",u:"field",n:"Minor burn",
 s:"Sunburn-type burns, or small blistered burns smaller than the person's palm, away from the face, hands, feet, genitals, and joints.",
 sg:["Superficial: red, painful, no blisters.","Partial thickness: blisters (key sign), smaller than the person's palm."],
 tx:["Stop the burning and remove jewelry and smoldering clothing.","Cool with water. Up to 30 minutes helps pain, but watch for chilling.",
  "Clean gently with drinkable water. Aloe on superficial burns.","Leave blisters closed. Cover with a slightly moist sterile or non-stick dressing.",
  "Elevate. Ibuprofen per label for pain and swelling. Keep them drinking.","Change dressings every other day, soaking off old ones with clean water."],
 ev:["Signs of infection, or it isn't healing.","Consider evacuating for a blistering sunburn with fever, nausea, and weakness (sun poisoning)."],
 av:["No ice, butter, or popping blisters."],
 rel:["burn-evac","burn-serious"]},
{id:"burn-evac",c:"trauma",u:"evac",n:"Burn needing evacuation",
 s:"Blistered burns larger than a palm or in a high-risk spot, or any deep burn.",
 sg:["Blisters covering more than about 1% of the body (the person's palm).",
  "Blisters on the face, eyes, neck, chest, hands, feet, or genitals, or wrapping around a limb.","Any deep (full-thickness) burn: white, waxy, leathery, charred, or painless at the center.","A burn with a fracture."],
 tx:["Stop the burning and cool briefly. Watch for chilling.","Clean gently and cover with slightly moist sterile dressings. Separate burned fingers and toes.",
  "Keep blisters closed. Wrap loosely, elevate, and gently move the burned area regularly.",
  "Keep them drinking until urine is clear and plentiful.","If evacuation will happen within 24 hours, don't change the dressings."],
 ev:["Evacuate. Rapid evacuation if it meets Serious burn criteria."],
 rel:["burn-serious","burn-minor"]},
{id:"burn-serious",c:"trauma",u:"rapid",n:"Serious burn",
 s:"Large burns, deep burns larger than a palm, or any sign of an airway burn.",
 sg:["Blistered burns covering more than 9% of the body (about 9 palms).","Deep (full-thickness) burns larger than the person's palm.",
  "Airway: singed hair or soot at nose or mouth, hoarse voice or wheezing, gray-black cough, swelling at mouth or neck, shortness of breath.","Electrical burns, including lightning."],
 tx:["Stop the burning. Remove clothing and jewelry that isn't stuck.",
  "Cool briefly. Large burns lose heat fast, so watch for hypothermia.",
  "Cover with clean, slightly moist dressings or plastic wrap, and keep warm.",
  "If alert with no airway signs, encourage drinking.",
  "Watch breathing closely. An airway burn can swell shut hours later."],
 ev:["Rapid evacuation."],
 rel:["burn-evac","burn-minor","hypo-mild"]},
{id:"eye",c:"trauma",u:"field",n:"Eye injury or something in the eye",
 s:"Flush loose debris. Anything stuck in or cutting the eye needs rapid evacuation.",
 tx:["Don't rub.","Flush with lots of clean water, pouring away from the uninjured eye.",
  "Check under the upper lid by flipping it over a swab. Lift loose specks with moist gauze.",
  "Can't get it out: cover both eyes and evacuate.",
  "Scratched eye (gritty, burning, painful blinking): cool compresses, saline drops for comfort, and watch for infection.",
  "Chemical in the eye: hold the lid open and flush for at least 20 minutes.",
  "Embedded object: stabilize it with moist sterile cloth, cover both eyes, don't remove it."],
 ev:["Impaled object, or an eye that is misshapen or leaking: rapid evacuation.",
  "Object that won't come out, chemical or heat burn to the eye, vision changes, or pain worsening over 24 hours."],
 rel:["snowblind","impaled"]},
{id:"ear",c:"trauma",u:"field",n:"Ear injury, earache, or object in the ear or nose",
 s:"Clean outer ear cuts like any wound. Fluid draining from inside the ear after a blow can mean a head injury.",
 sg:["Blood or clear fluid from inside the ear, hearing loss, ringing, or severe pain.","Swimmer's ear: pain when the earlobe is pulled, itching, discharge, after swimming or getting water in the ear.","Middle ear infection: deep ache, often with a cold, maybe fever."],
 tx:["Blood or fluid from inside the ear after a blow: treat as a serious head injury. Let it drain, cover loosely, don't plug it.",
  "Outer ear cut: direct pressure and wound care.",
  "Object in the ear: tilt the head to that side and tap gently. Remove only if you can see and easily grasp it.",
  "Insect in the ear: tilt that ear up and pour in a little clean water or cooking oil to float it out, unless there's blood, fluid, or a possible burst eardrum.",
  "Object in the nose: block the other nostril and have them blow gently. Remove only if easy to grasp.",
  "Swimmer's ear: keep the ear dry; pain relievers per label.","Earache with a cold: fluids, pain relievers, and a decongestant if carried."],
 ev:["Blood or fluid from inside the ear, especially after a head injury, fall, or pressure injury (diving, blast): rapid evacuation.","Object that won't come out, hearing loss, or fever with ear pain."],
 av:["Don't probe the ear or nose with sticks, swabs, or tweezers you can't see past."],
 rel:["tbi","wound"]},
{id:"nosebleed",c:"trauma",u:"field",n:"Nosebleed",
 s:"Lean forward and pinch firmly for at least 10 minutes.",
 tx:["After any blow to the face or head, consider head and spine injury first.",
  "Sit up and lean slightly forward so blood doesn't run down the throat.",
  "Pinch the soft part of the nose just below the bone for at least 10 minutes without letting go to check. Skip this if the nose may be broken.",
  "Once mostly stopped, a rolled tissue plug in the nostril helps. Leave it in.",
  "Prevent: drink plenty, and a little petroleum jelly inside the nostrils in dry air."],
 ev:["Significant bleeding that's hard to control.","After a head injury.","Person takes blood thinners."],
 av:["Don't tilt the head back."]},
{id:"dental",c:"trauma",u:"field",n:"Tooth injury or toothache",
 s:"A knocked-out adult tooth has the best chance if it goes back in the socket right away.",
 tx:["After a blow to the face, consider head, jaw, and spine injury first, and watch the airway.",
  "Pick the tooth up by the crown (the white part), never the root.",
  "Adult tooth: gently rinse it and clear clots from the socket, then put it back in. It has a good chance of reattaching if a dentist sees it within about 30–60 minutes. Don't replant baby teeth.",
  "Can't replant it: store it in milk, egg white, coconut water, or saline. Otherwise wrap it in gauze with some of the person's saliva, or hold it inside the cheek if they're fully alert.",
  "Splint a loose or replanted tooth to its neighbors with dental floss or softened candle wax.",
  "Cover an exposed socket or broken tooth with temporary filling material, moist gauze, or cooled candle wax.",
  "Bleeding: bite on a clean dressing, or a moist black or green tea bag for 20–30 minutes.",
  "Toothache without injury: gauze soaked in clove oil around the tooth."],
 ev:["Knocked-out or partly knocked-out teeth.","Significant bleeding, signs of infection (pain swallowing or opening the mouth, facial swelling, fever), or a major blow to the head."]},
{id:"blisters",c:"trauma",u:"field",n:"Blisters",
 s:"Treat hot spots early. Drain big blisters at the edge and keep the roof on.",
 tx:["Hot spot: stop and cover it now with tape, a blister dressing, or a donut pad.",
  "Blister smaller than about ¼ in (5 mm): leave it intact and protect it the same way.",
  "Larger blister: clean it, pierce the lower edge with a sterile needle, press the fluid out without letting air in, and leave the roof on.",
  "Clean again, add ointment if you like, and cover with a friction-resistant dressing (Tegaderm, Leukotape, moleskin donut).",
  "Before taping: wipe skin with alcohol, use tincture of benzoin for grip, and round the tape corners.",
  "Prevent: dry socks (no cotton), well-fitted broken-in boots, trimmed toenails, and stopping at the first hot spot."],
 ev:["Signs of infection, or can't walk."],
 av:["Don't drain blisters in people with diabetes or other high-risk conditions."]},
{id:"chafing",c:"trauma",u:"field",n:"Chafing and saddle sores",
 s:"Friction and moisture wear the skin raw, often between the thighs, under pack straps, or on a bike saddle.",
 tx:["Clean the area with water and let it dry and air out.","Stop the friction: adjust straps, change into dry clothing, switch to synthetic or wool layers.",
  "Protect raw skin with a lubricant or barrier (anti-chafe balm, petroleum jelly, chamois cream) or a non-stick dressing.",
  "Saddle sores: keep clean and dry, change out of wet shorts promptly, adjust saddle and fit, and take a rest day if possible."],
 ev:["Signs of infection: spreading redness, pus, a painful lump (abscess), fever.","Pain severe enough to stop travel."],
 rel:["fungal","blisters"]},
{id:"fungal",c:"trauma",u:"field",n:"Fungal skin infections (athlete's foot, jock itch)",
 s:"Itchy, red, scaly rash in warm, damp areas. Keep it dry and use antifungal cream.",
 sg:["Itching, redness, scaling, or cracking between toes, in the groin, or under skin folds.","Often a defined edge, worse with sweat and wet socks."],
 tx:["Wash and dry thoroughly, especially between the toes.","Air feet and skin out at camp; sleep in dry socks.",
  "Antifungal cream or powder (clotrimazole, terbinafine) per label, continuing for a week or two after it clears.","Change socks and underwear often."],
 ev:["Spreading redness, warmth, swelling, or pus (bacterial infection), or cracks that won't heal."],
 rel:["chafing"]},
{id:"toenail",c:"trauma",u:"field",n:"Toenail injuries (black toenail, ingrown nail)",
 s:"Blood under the nail from long descents, or an ingrown edge. Painful, usually not serious.",
 sg:["Black toenail: dark red or black under the nail, throbbing pressure, after downhill travel or a stubbed toe.","Ingrown nail: red, swollen, tender skin along the nail edge."],
 tx:["Black toenail with severe throbbing in the first 2 days: a trained person can relieve pressure by slowly twisting a sterilized needle through the nail over the blood until it drains. Clean and cover afterward.",
  "Otherwise leave it; the nail may fall off weeks later.",
  "Ingrown nail: soak in warm water, gently lift the corner and tuck a wisp of floss or cotton under it, and cover.",
  "Prevent: trim nails straight across before the trip, and lace boots so the heel doesn't slide on descents."],
 ev:["Signs of infection, a possible broken toe, or pain that stops walking."],
 rel:["blisters","fracture"]},
{id:"sunburn",c:"trauma",u:"field",n:"Sunburn and sun poisoning",
 s:"A UV burn. Blistering or feeling sick with it means more than a simple sunburn.",
 sg:["Red, hot, painful skin hours after sun exposure; blisters if deeper.","Sun poisoning: blistering sunburn plus fever, nausea, weakness, or loss of appetite."],
 tx:["Get out of the sun. Cool soaks, aloe, and ibuprofen per label.","Drink plenty of fluids.","Leave blisters closed and cover broken ones like a minor burn.",
  "Prevent: cover up, use broad-spectrum sunscreen (SPF 30+) and reapply every 2 hours, and remember that snow, water, and altitude intensify UV."],
 ev:["Large blistering sunburn, or signs of sun poisoning."],
 rel:["burn-minor","dehydration","snowblind"]},

/* ---------- ENVIRONMENT ---------- */
{id:"cold-stress",c:"env",u:"field",n:"Cold stress (not yet hypothermic)",
 s:"Cold and shivering, thinking and moving normally. Warm them up before it becomes hypothermia.",
 sg:["Shivering, feels cold.","Alert, oriented, moving normally or nearly so."],
 tx:["Get out of wind and wet. Add dry layers and a hat.","High-calorie food and a warm, sweet drink.","Then move around or exercise to generate heat."],
 ev:["Getting clumsier, more confused, or apathetic: see Mild hypothermia."],
 rel:["hypo-mild"]},
{id:"hypo-mild",c:"env",u:"field",n:"Mild hypothermia",
 s:"Shivering hard, still alert, but clumsy or making poor decisions. Rest, wrap, add heat and calories.",
 sg:["Vigorous shivering.","Alert, but irritable, apathetic, lethargic, or making poor decisions.","Clumsy, stumbling, poor fine motor skills (the “umbles”: stumbles, mumbles, fumbles, grumbles)."],
 tx:["Handle gently.","Have them sit or lie down for at least 30 minutes.",
  "Get out of wind and cold. Wet clothes: if shelter or transport is under 30 minutes away, wrap them as they are; if it's further, shield them from the weather, remove wet clothing, then wrap.",
  "Hypothermia wrap: pad underneath, vapor barrier, insulation including head and neck, windproof outer layer.",
  "The wrap keeps heat in but doesn't make it. Put hot water bottles or heat packs on the upper trunk (chest, sides, back), never directly on skin. Check the skin hourly for burns.",
  "High-calorie food and drink. Shivering is the body's best rewarming method and needs fuel.",
  "After 30 minutes of rewarming and calories, an alert person who can stand may do light exercise."],
 ev:["No improvement after 30 minutes of rewarming and calories."],
 rel:["cold-stress","hypo-severe","frostbite"]},
{id:"hypo-severe",c:"env",u:"rapid",n:"Moderate to severe hypothermia",
 s:"Cold with drowsiness, confusion, or shivering that has slowed or stopped. Handle gently, keep horizontal, wrap, and evacuate.",
 sg:["Moderate: drowsy or confused, poor movement, shivering intermittent or stopped, slowing pulse and breathing.",
  "Severe: barely responsive or unresponsive, no shivering, very slow pulse and breathing, dilated pupils. May appear dead.",
  "Cold and unresponsive: assume severe hypothermia.","Anyone in cold water for 30 minutes or more: treat as at least moderate, even if walking and talking."],
 tx:["Handle as gently as possible and keep horizontal. Rough movement or standing can trigger cardiac arrest. Lift from water or crevasses horizontally if you can.",
  "No walking or standing. No food or drink with reduced responsiveness.",
  "Hypothermia wrap: pad underneath, vapor barrier, insulation including head and neck, windproof outer layer. Cut wet clothing away rather than pulling it off, following the same 30-minute rule as mild hypothermia.",
  "Heat sources on the upper trunk (chest, sides, back), not directly on skin. Check skin hourly for burns.",
  "Check for a pulse at the neck or groin and for breathing for a full 60 seconds. If none, start CPR; cold patients can survive prolonged CPR. They're not dead until they're warm and dead."],
 ev:["Rapid evacuation, carefully and horizontally."],
 av:["No rubbing limbs, no alcohol, no hot showers or baths in the field."],
 rel:["hypo-mild","cpr"]},
{id:"frostnip",c:"env",u:"field",n:"Frostnip",
 s:"Numb, pale skin that is still soft. Warm it now.",
 sg:["Tingling, pain, or numbness on cheeks, nose, ears, fingers, or toes.","White or waxy, but still soft and springs back when pressed."],
 tx:["Replace wet clothing with dry.","Rewarm skin to skin: hands in armpits or groin, feet on a partner's belly, a warm hand over the face.","Protect from further cold; the area will freeze more easily now."],
 ev:["Skin stays hard, gray, or blisters: see Frostbite."],
 rel:["frostbite"]},
{id:"metal",c:"env",u:"field",n:"Skin frozen to metal",
 s:"Wet skin, lips, or tongue stuck to very cold metal. Don't pull it off; warm it free.",
 tx:["Don't pull or tug.","Pour warm (not hot) water over the stuck skin and the metal, or breathe warm air on it.","Ease the skin free as it releases.","Treat any torn skin as an open wound."],
 ev:["Large torn areas, or a tongue or lip injury that bleeds heavily or keeps them from eating and drinking."],
 rel:["frostnip","wound"]},
{id:"frostbite",c:"env",u:"evac",n:"Frostbite",
 s:"Frozen tissue. Rewarm shallow frostbite. Leave deep frostbite frozen unless evacuation will take many hours or days.",
 sg:["Superficial: pale, numb skin that is still pliable. Clear blisters reaching the fingertips after rewarming.",
  "Deep (full thickness): hard, white, waxy, numb, sometimes burgundy. Dark, blood-filled blisters that don't reach the tips appear later, or none."],
 tx:["Treat hypothermia first.",
  "Superficial: rewarm skin to skin (hands in armpits or groin, feet on a partner's bare belly), or in water at 100–102 °F (38–39 °C) for about 30 minutes until circulation returns. Keep the skin off the pot. It will hurt.",
  "Deep: leave it frozen if there's any chance it will refreeze. Rewarm in the field only if evacuation will take many hours or days.",
  "Once thawed, never let it refreeze. Thawing and refreezing does the most damage.",
  "Dress like a burn: gauze between fingers or toes, loose wrap, insulation, windproof cover. Splint and protect from pressure.",
  "Ibuprofen per label for pain and swelling. Leave blisters intact."],
 ev:["All frostbite needs medical evaluation, even after field rewarming.","Less than 2 hours from care: evacuate now and rewarm there.",
  "Deep frostbite: advanced treatments work best within 12–24 hours of freezing, so evacuate promptly."],
 av:["Don't rub or massage, or rub with snow.","Don't warm over a fire or stove; numb tissue burns easily.","No alcohol or smoking."],
 rel:["frostnip","hypo-mild"]},
{id:"trench",c:"env",u:"field",n:"Immersion foot (trench foot)",
 s:"Feet wet and cold for days without freezing. Dry them out and keep them dry.",
 sg:["Feet cold and wet for days; symptoms rarely appear in under about 4 days.","Cold, swollen, waxy feet with burgundy to blue blotches.","Later: red, hot, painful, blistered."],
 tx:["Remove wet socks and boots and let feet dry. Dry the boots if possible and put on dry socks.",
  "Protect from freezing. Ibuprofen per label for pain and swelling.",
  "Prevent: dry feet every night, keep a dry pair of socks for sleeping, dry wet socks against your torso overnight, use foot powder."],
 ev:["Signs of infection, or can't walk."],
 av:["Don't rub or massage."]},
{id:"heat-minor",c:"env",u:"field",n:"Heat cramps and heat fainting",
 s:"Muscle cramps from exertion, or fainting in the heat that clears quickly once lying flat.",
 sg:["Cramps: painful spasms in legs, arms, or belly during or right after exercise.",
  "Heat fainting: passed out or nearly passed out while upright in the heat, and fully alert again within moments of lying flat. A few brief twitches can happen.",
  "Not heat fainting: stiffening and jerking with a long confused period afterward (seizure), or not fully alert right away (treat as heat stroke)."],
 tx:["Lay them flat or in the recovery position. Move to shade.",
  "Cramps: gentle stretching and massage.",
  "Over 1–2 hours of rest, offer up to 1 liter per hour of fluid with electrolytes, or water with salty food. Let thirst guide it; don't force fluids.",
  "After a faint, do a full head-to-toe check and vital signs, and ask exactly what happened."],
 ev:["Fainting that repeats, or with no clear heat-related explanation."],
 rel:["heat-exhaustion","heatstroke","faint"]},
{id:"heat-exhaustion",c:"env",u:"field",n:"Heat exhaustion",
 s:"Overheated and depleted, but thinking clearly. Lie flat, cool, rest, and replace fluid and salt.",
 sg:["Fatigue, weakness, headache, dizziness, nausea, intense thirst.","Fast, weak pulse; fast breathing.","Pale, clammy skin with heavy sweating, or flushed.","Normal mental status. Core temperature below 104 °F (40 °C) if measured."],
 tx:["Lay them flat or in the recovery position.","Move to shade. Remove extra layers and insulate from hot ground.",
  "Cool by sponging with cool water and fanning.",
  "Over 1–2 hours of rest, offer up to 1 liter per hour of fluid with electrolytes, or water with salty food. Sip slowly, guided by thirst; don't force it or overdo it.",
  "Rest at least 1–2 hours, and up to 12–24 hours depending on how they respond.","Keep checking vital signs."],
 ev:["Any confusion or odd behavior: treat as heat stroke.","Not resolving with treatment, or can't keep fluids down for 24 hours."],
 rel:["heatstroke","heat-minor","hyponatremia"]},
{id:"heatstroke",c:"env",u:"rapid",n:"Exertional heat stroke",
 s:"Altered mental status during or after exertion in heat. Cool the whole body immediately, within 30 minutes, then evacuate.",
 sg:["Confusion, agitation, irrational behavior, collapse, seizure, or unresponsiveness. May collapse with no warning.",
  "During or after exertion, usually in warm weather but possible in cool weather.",
  "Core temperature above 104 °F (40 °C) if measured. A rectal reading is the only reliable one.",
  "Skin can be pale or flushed, wet with sweat, and may even feel cool. Skin temperature does not rule heat stroke in or out."],
 tx:["Lay them flat or in the recovery position, out of the sun. Remove insulating clothing and gear.",
  "Start whole-body cooling immediately with the best method you have, while working toward a better one. Aim to cool within 30 minutes of collapse.",
  "Best: cold-water immersion of torso and limbs (with ice or snow if available), holding the head and airway clear of the water.",
  "Next best: lay them on a tarp, raise the edges, and fill or douse with cold water.",
  "Otherwise: cold wet sheets or towels on torso and limbs, rewetted constantly, with hard fanning. Cold packs on cheeks, palms, soles, and neck help a little.",
  "Cool until mental status improves (or to 102 °F / 39 °C if you can measure it). If there's no improvement after 30 minutes of immersion, stop, reassess, and consider other causes.",
  "Protect the airway and expect seizures."],
 ev:["Rapid evacuation after cooling, even if they seem to recover."],
 av:["Don't give acetaminophen, aspirin, or other fever reducers.","Don't stop at fanning or cold packs alone if anything better is available."],
 rel:["heat-exhaustion","hyponatremia"]},
{id:"hyponatremia",c:"env",u:"evac",n:"Exercise-associated hyponatremia (low sodium)",
 s:"Too much water during long exertion. Looks like heat illness, but they've been drinking a lot and are urinating little.",
 sg:["Drinking large amounts of plain water or sports drink during exercise lasting more than about 4 hours.",
  "Headache, nausea, vomiting, fatigue, dizziness, blurred vision, poor coordination.",
  "Puffy hands, feet, or face; possible weight gain (rings and pack straps tight).","Little or no urine.","Near-normal body temperature.",
  "Severe: confusion, hallucinations, seizures, unresponsiveness, or breathing trouble from fluid in the lungs. Can appear hours after exercise ends."],
 tx:["Rest, cool, and get out of the heat.","Stop all plain water.",
  "Rule out dehydration (thirst, weight loss, little intake) and heat stroke (high core temperature) before treating as hyponatremia. If heat stroke is possible, cool first.",
  "If alert and able to protect their airway: salty food, or 3–4 bouillon cubes dissolved in about ½ cup (125 ml) of water.",
  "Heavy urination after rest is a good sign of recovery.",
  "Confused, seizing, or struggling to breathe: nothing by mouth, protect the airway, rapid evacuation."],
 ev:["Altered responsiveness, seizure, other nerve problems, or breathing trouble: rapid evacuation.","Mild and improving with salt and rest: continued observation may be enough."],
 rel:["heatstroke","heat-exhaustion","dehydration"]},
{id:"dehydration",c:"env",u:"field",n:"Dehydration",
 s:"Not enough fluid. Rehydrate slowly with some salt and sugar.",
 sg:["Thirst, infrequent dark yellow urine, dry lips and eyes.","Headache, fatigue, irritability, poor decisions.","Dizziness or fainting when standing up."],
 tx:["Reduce activity. In sun and heat, shade and cool them.",
  "Rehydrate slowly, starting around 200 ml (a little under 1 cup) per hour, enough to keep urine flowing without causing vomiting.",
  "Replace electrolytes, especially with vomiting or diarrhea. WHO-style oral rehydration: in 1 liter of water, ½ tsp table salt, ¼ tsp salt substitute (potassium chloride), ½ tsp baking soda, 3 tbsp sugar.",
  "Simple, easy-to-tolerate food.","Prevent: drink often (4–6 liters a day in heat), and no more than 10 liters in 24 hours."],
 ev:["Can't rehydrate them over 24–48 hours.","Signs of shock."],
 rel:["heat-exhaustion","gi"]},
{id:"ams",c:"env",u:"field",n:"Acute mountain sickness (AMS)",
 s:"Headache and feeling unwell after gaining altitude. Don't go higher until it clears.",
 sg:["Usually above about 8,000 ft (2,500 m), sometimes as low as 6,500 ft (2,000 m). Starts 6–12 hours after arrival, but can be 1 hour to 4 days.",
  "Headache plus one or more: poor appetite, nausea, vomiting, fatigue, weakness, dizziness, lightheadedness.",
  "Poor sleep is normal at altitude and not on its own a sign of AMS."],
 tx:["Stop ascending. Go higher only after symptoms fully resolve.",
  "Rest, eat, drink fluids. Avoid alcohol and sleeping pills.",
  "Ibuprofen or acetaminophen for headache. Prescription ondansetron for nausea and acetazolamide to speed acclimatization, if carried.",
  "Moderate to severe AMS: descend 1,000–3,300 ft (300–1,000 m), until symptoms resolve. Oxygen or dexamethasone if available. Never let them descend alone."],
 ev:["Mild AMS that worsens or doesn't improve in 1–2 days: descend.","Ataxia, confusion, or breathlessness at rest (HACE or HAPE): descend now."],
 av:["Never go higher with symptoms.","Don't send anyone with altitude illness down alone.","Rule out carbon monoxide if a stove ran in the tent or shelter."],
 rel:["hace","hape","co"]},
{id:"hace",c:"env",u:"rapid",n:"High altitude cerebral edema (HACE)",
 s:"Brain swelling at altitude. Descend immediately.",
 sg:["Often follows worsening AMS, but not always.","Loss of coordination: can't walk a straight heel-to-toe line.","Confusion, altered behavior, extreme drowsiness, decreasing responsiveness.","Rare below 10,000 ft (3,000 m). Can progress to unresponsiveness in under 3 hours."],
 tx:["Descend now, day or night, until symptoms improve or resolve, usually 1,000–3,300 ft (300–1,000 m). Never alone; they may need help or carrying.",
  "Oxygen at 2–4 liters per minute if available, aiming for symptom relief.",
  "Dexamethasone if available (prescription).",
  "A portable hyperbaric bag can save a life if descent is impossible, but must not delay descent."],
 ev:["Rapid evacuation."],
 rel:["ams","hape"]},
{id:"hape",c:"env",u:"rapid",n:"High altitude pulmonary edema (HAPE)",
 s:"Fluid in the lungs at altitude, the most common cause of death from altitude illness. Descend and minimize exertion.",
 sg:["Breathless at rest (the key sign; breathlessness with exertion is normal at altitude).","Much weaker and slower than others at the same altitude.","Cough becoming wet; crackling in the chest; worse lying flat.","Blue lips, fast pulse and breathing, low-grade fever.","Pink, frothy sputum (late and ominous).","Can occur without AMS."],
 tx:["Descend at least 3,300 ft (1,000 m), or until relief, with as little exertion as possible: carry them, use a vehicle, animal, or helicopter, and rest often.",
  "Keep them warm; cold worsens fluid in the lungs. Sit upright.",
  "Oxygen at 4–6 liters per minute if available.","Nifedipine if available (prescription). Dexamethasone if HACE is also suspected.",
  "Portable hyperbaric bag if descent is delayed."],
 ev:["Rapid evacuation."],
 rel:["ams","hace"]},
{id:"lightning",c:"env",u:"rapid",n:"Lightning strike",
 s:"Victims don't hold a charge. Treat those who look dead first; they may only need breathing support.",
 tx:["Make sure you're safe; the storm may still be active.",
  "Touch them right away. Lightning victims don't carry a charge.",
  "With several victims, treat the ones who appear dead first. They may be in breathing arrest and survive with rescue breathing.",
  "Rescue breathing or CPR as needed. Breathing support may be needed for a long time.",
  "Check for burns, fractures and spine injury from being thrown, ruptured eardrums, and eye injury. Temporary limb paralysis usually resolves.",
  "Suspect hypothermia; a strike can disrupt temperature control. Keep them warm."],
 ev:["Rapid evacuation for anyone struck, even if they seem fine."],
 rel:["cpr","burn-serious","spine"]},
{id:"drowning",c:"env",u:"rapid",n:"Drowning",
 s:"Breathing first. Anyone who struggled to breathe after being in the water needs evacuation.",
 tx:["Hello, reach, throw, row, go, helicopter. Enter the water only if trained and equipped.",
  "Remove from the water, horizontally if it was cold.",
  "Not breathing: give 5 rescue breaths, then CPR at 30:2 with good breaths. If it's safe and doesn't slow the rescue, start breaths while still in the water. Never do compressions in the water.",
  "Vomiting is common: roll to the side, clear the mouth, continue.",
  "In cold water more than 30 minutes: treat as hypothermic, even if they seem fine. Wrap and add heat to the upper trunk.",
  "Spine precautions only after diving, an unknown mechanism, or other signs of spine injury."],
 ev:["Lost consciousness, needed rescue breaths, or has reduced responsiveness.",
  "Breathing trouble any time in the next 24 hours, persistent cough, or foamy sputum.",
  "Weak pulses, ongoing fast heart rate, or existing heart or lung disease."],
 rel:["cpr","hypo-severe"]},
{id:"avalanche",c:"env",u:"rapid",n:"Avalanche burial",
 s:"Speed of the dig matters most. Then airway, breathing, hypothermia, and injuries.",
 tx:["Watch for further slides. Turn transceivers to search, probe, and dig from downhill toward the victim.",
  "Expose the face and chest first. Clear the mouth and nose, and note whether there was an air pocket and whether the airway was packed with snow.",
  "Not breathing: give rescue breaths and start CPR. Lack of oxygen is the main cause of avalanche deaths.",
  "Handle gently and keep horizontal; assume hypothermia after any significant burial.",
  "Insulate from the snow, wrap, and add heat to the upper trunk.",
  "Do a full injury survey: trauma, including spine and chest, is common."],
 ev:["Rapid evacuation for anyone buried, even if they seem fine."],
