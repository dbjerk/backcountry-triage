 av:["Resuscitation is less likely to succeed after burial over an hour with the airway packed with snow, or with injuries incompatible with life. Follow your training and medical direction."],
 lab:{av:"Note"},
 rel:["cpr","hypo-severe","spine"]},
{id:"snowblind",c:"env",u:"field",n:"Snow blindness",
 s:"Sunburned eyes. Painful, but heals in a day or two.",
 sg:["6–12 hours after sun on snow, water, or at altitude.","Gritty, painful, red, watery eyes; pain moving the eyes; light sensitivity."],
 tx:["Get into a dark space. Protect the eyes from more UV.","Cool, moist cloths over closed eyes. Saline drops for comfort.",
  "Ibuprofen per label. Remove contact lenses.","Check for a foreign object, since it feels the same.",
  "Prevent: sunglasses with side shields, or improvised slit goggles from cardboard or tape."],
 ev:["Not better in 72 hours, or vision stays blurred."],
 av:["Don't rub the eyes."],
 rel:["eye"]},
{id:"chemical",c:"env",u:"evac",n:"Chemical, fuel, or bear spray on skin or in eyes",
 s:"Remove the substance and flush with lots of water. Bear spray pain usually fades within an hour.",
 tx:["Protect yourself; wear gloves and stay upwind.","Brush off dry powders before using water. Remove contaminated clothing and jewelry.",
  "Skin: flush with lots of cool running water for at least 15 minutes, letting it run away from unaffected areas.",
  "Eyes: hold the lids open and flush for at least 20 minutes, pouring away from the other eye. Remove contact lenses.",
  "Stove fuel on skin: wash with soap and water; remove soaked clothing (it can cause burns and is flammable).",
  "Bear spray: get to fresh air, flush eyes with lots of water, don't rub, wash skin with soap and cool water. Burning usually eases within 30–60 minutes.",
  "Treat chemical burns like other burns afterward."],
 ev:["Chemical in the eye with continuing pain or vision changes, or large or deep skin burns.","Breathing trouble after inhaling a chemical or bear spray: rapid evacuation."],
 rel:["eye","burn-evac","poison"]},
{id:"co",c:"env",u:"evac",n:"Carbon monoxide poisoning",
 s:"Odorless gas from stoves, heaters, and engines in enclosed spaces. Get everyone into fresh air.",
 sg:["A stove, heater, lantern, or engine used in a tent, vestibule, snow cave, cabin, or vehicle.",
  "Headache, dizziness, confusion, drowsiness, progressing to unresponsiveness and breathing arrest.",
  "Several people in the same space feeling unwell is a strong clue.","Easily mistaken for altitude sickness. Cherry-red skin is a late, unreliable sign."],
 tx:["Protect yourself. Rescuers can be overcome within minutes; ventilate or go in briefly.",
  "Get everyone out of the enclosed space into fresh air.",
  "Check airway and breathing. Rescue breaths if breathing is inadequate.",
  "High-flow oxygen if available. Recovery takes hours, longer at altitude."],
 ev:["Evacuate anyone suspected of carbon monoxide poisoning.","Any change in responsiveness: rapid evacuation."],
 av:["Never run a stove inside a closed tent or snow cave, however efficient it is."],
 rel:["ams","altered"]},
{id:"smoke",c:"env",u:"evac",n:"Smoke inhalation",
 s:"Wildfire or campfire smoke irritates the airways and can carry carbon monoxide. Airway burn signs mean rapid evacuation.",
 sg:["Cough, wheezing, sore throat, shortness of breath, watery eyes.",
  "Airway burn signs: hoarse voice, noisy or high-pitched breathing, soot in the nose or mouth, singed facial hair, swelling of the mouth or throat.",
  "Headache, confusion, or drowsiness (carbon monoxide)."],
 tx:["Move to clean air, away from the smoke.","Sit upright. Loosen tight clothing.","Rinse eyes with clean water.",
  "Help an asthmatic use their inhaler.","Oxygen if available.","Watch breathing closely; airway swelling can worsen over hours."],
 ev:["Any airway burn sign, breathing trouble, or confusion: rapid evacuation.","Persistent cough or breathlessness, chest pain, or existing heart or lung disease."],
 rel:["co","burn-serious","asthma"]},

/* ---------- BITES, STINGS & PLANTS ---------- */
{id:"sting",c:"bite",u:"field",n:"Bee or wasp sting",
 s:"Remove the stinger fast and watch for anaphylaxis for the next hour.",
 tx:["Move away from the nest; many stinging insects defend territory.",
  "Remove the stinger quickly. Any method works; speed matters most.",
  "Cold compress for pain. Antihistamine per package for itch and swelling, or hydrocortisone cream.",
  "Watch for 30–60 minutes for signs of anaphylaxis.",
  "Large local swelling, even past a joint, isn't anaphylaxis. Elevate and cool."],
 ev:["Any sign of anaphylaxis: rapid evacuation.","Dozens of stings, or a sting inside the mouth or throat."],
 rel:["anaphylaxis","allergic-mild"]},
{id:"snakebite",c:"bite",u:"rapid",n:"Snakebite (rattlesnake / pit viper)",
 s:"Rest, reassure, rapid evacuation. Nothing in the field changes the outcome as much as getting to antivenom.",
 sg:["Fang marks, pain, swelling spreading from the bite, blisters, oozing.","Metallic taste, numbness, tingling.","Severe: shock, breathing trouble, unresponsiveness.","Some bites inject no venom, but treat every bite as if it did."],
 tx:["Get everyone away from the snake. Detached heads and dead snakes can still bite.",
  "Remove or cut off rings, watches, and anything tight on the limb.",
  "Rest, reassure, and start rapid evacuation. Walking out is fine if it's the fastest way.",
  "Wash the bite with soap and water and cover with a sterile dressing.",
  "Circle the bite with a marker and write the time on the skin. Mark the leading edge of swelling and redness with the time every 30 minutes.",
  "If it doesn't interfere with circulation, loosely splint the limb in a natural position at about heart level.",
  "Anaphylaxis from snakebite is rare, but give epinephrine if it occurs."],
 ev:["Rapid evacuation to a hospital that can give antivenom, which may not be the nearest one."],
 av:["No cutting, suction, tourniquet, ice, water immersion, or electric shock.","No pressure bandages or pressure-immobilization wraps.",
  "No ibuprofen, aspirin, naproxen, or alcohol.","Don't bring the snake, dead or alive."]},
{id:"tick",c:"bite",u:"field",n:"Tick bite",
 s:"Remove it cleanly and watch for illness over the coming weeks.",
 tx:["Grasp with fine-tipped tweezers as close to the skin as possible. Pull gently and steadily; direction doesn't matter.",
  "Clean the bite and watch it for infection. Note the date and where you were.",
  "Watch for illness for at least two weeks, and up to a month: expanding red rash (sometimes a bullseye), fever, chills, headache, muscle or joint aches, or a spotted rash on wrists and ankles.",
  "Prevent: daily tick checks, and permethrin on clothing."],
 ev:["Any sign of tick-borne illness after a bite.","Weakness spreading up from the legs: see Tick paralysis."],
 av:["Don't squeeze the body or use heat, matches, or petroleum jelly."],
 rel:["tick-paralysis"]},
{id:"tick-paralysis",c:"bite",u:"evac",n:"Tick paralysis",
 s:"Weakness climbing from the legs, caused by an attached tick. Find it and remove it.",
 sg:["Unsteady walking, then weakness spreading upward over hours to days.","No fever.","Can reach the breathing muscles."],
 tx:["Search the whole body for an attached tick: scalp, hairline, behind ears, armpits, groin.","Remove it. Symptoms usually improve within hours."],
 ev:["Not improving after removal.","Trouble breathing or swallowing: rapid evacuation."],
 rel:["tick"]},
{id:"spider",c:"bite",u:"evac",n:"Spider bite (black widow, recluse)",
 s:"Most suspected spider bites are actually skin infections. Widow bites cause cramping; recluse bites can ulcerate.",
 sg:["Black widow: painful bite, then painful, sustained muscle spasms starting hours later, sometimes as severe as a belly emergency.",
  "Recluse: usually mild irritation, but can become a spreading, dying patch of skin with high infection risk."],
 tx:["Keep the person calm.","Clean the wound and give good wound care.","Treat anaphylaxis if it occurs.","Cold compress and pain medication per label."],
 ev:["Any muscle spasms after a black widow bite, even local ones.","Pain, tissue damage, infection, or body-wide symptoms."],
 rel:["wound"]},
{id:"animal-bite",c:"bite",u:"evac",n:"Mammal bite or bat contact (rabies risk)",
 s:"Clean it immediately and thoroughly. Rabies is preventable if shots start early.",
 tx:["Control bleeding.",
  "Wash with soap and water, then irrigate with lots of water and a virucide such as povidone-iodine if you have it. Repeat. This is the one wound where soap and iodine are recommended.",
  "Look for more wounds; don't ignore small scratches.",
  "Don't close the wound. Dress loosely.",
  "High rabies risk: bats, raccoons, skunks, foxes, and any wild mammal acting strangely. Any contact with a bat counts, including waking with a bat in the tent."],
 ev:["All mammal bites that break the skin, and any bat contact, to a facility that can start rabies shots promptly. Once rabies symptoms appear, it is almost always fatal."],
 rel:["wound"]},
{id:"plant-rash",c:"bite",u:"field",n:"Plant rash (poison ivy, nettle)",
 s:"Wash the oil off fast. It binds to skin within about an hour.",
 sg:["Poison ivy, oak, or sumac: red, itchy, burning rash with blisters, usually 24–48 hours after contact.","Stinging nettle: immediate burning and raised bumps that fade within hours."],
 tx:["Wash skin as soon as possible with cold water and soap, or a cleanser made for urushiol (Tecnu and similar). After about 60 minutes, little will wash off.",
  "Wash clothing, tools, and pets; the oil stays active on them.","Cool compresses, oral antihistamine, and hydrocortisone cream early.",
  "Cornstarch, baking soda, oatmeal, or aloe can ease itching. Don't scratch.","Prevent: learn to recognize the plants, including bare winter stems."],
 ev:["Severe or persistent reactions, heavy blistering or swelling, or rash on face, eyes, or genitals.","Signs of infection.","Breathing trouble after smoke from burning poison ivy: rapid evacuation."]},
{id:"phototoxic",c:"bite",u:"field",n:"Wild parsnip and giant hogweed burns",
 s:"Plant sap plus sunlight causes burns and blisters a day or two later. Wash it off and keep the skin out of the sun.",
 sg:["Contact with sap from wild parsnip, giant hogweed, or (usually milder) cow parsnip, then sun exposure.",
  "About 24 hours later: redness and swelling. About 48 hours: painful blisters, sometimes in streaks.","Dark staining that can last months; the skin stays sun-sensitive."],
 tx:["Wash skin with soap and cool water as soon as possible.","Cover the area from sunlight for at least 48 hours.",
  "Cool compresses and pain relievers per label. Treat blisters like burns: keep them intact and covered.",
  "Sap in the eyes: flush for at least 15 minutes and wear sunglasses.",
  "Afterward, protect the area with clothing and sunscreen for months."],
 ev:["Sap in the eyes, large or blistered areas, burns on the face or groin, or signs of infection."],
 av:["Don't cut or handle these plants bare-skinned in sun."],
 rel:["burn-minor","plant-rash"]},
{id:"allergic-mild",c:"bite",u:"field",n:"Mild allergic reaction",
 s:"Hives or itching in one area, with no breathing or swelling problems.",
 sg:["Itchy rash or hives in one area.","Itchy eyes, sneezing.","No breathing trouble, no face or tongue swelling, no dizziness."],
 tx:["Remove or avoid the trigger.","Antihistamine per package. Cool compress.","Watch closely for an hour, with epinephrine ready if they carry it."],
 ev:["Any sign of anaphylaxis: rapid evacuation."],
 rel:["anaphylaxis"]},

/* ---------- ILLNESS ---------- */
{id:"cardiac",c:"med",u:"rapid",n:"Chest pain (possible heart attack)",
 s:"Treat chest pressure as cardiac. Minimize exertion and get out fast, carried or flown.",
 sg:["Pressure, squeezing, or pain in the chest lasting more than 3–5 minutes, not relieved by rest or changing position, and not worse when pressing on the chest wall.",
  "May spread to arms, jaw, neck, or between the shoulder blades.","Shortness of breath, sweating, nausea, pale skin, weakness, dizziness, fainting, anxiety or denial.",
  "Women, older adults, and diabetics often have softer signs: fatigue, nausea, mild discomfort that comes and goes. This person usually looks sick."],
 tx:["Stop all exertion and reduce anxiety. Let them choose a comfortable position, usually half-sitting.",
  "Aspirin: suggest they chew 324 mg of non-coated aspirin (four 81 mg or one 325 mg), unless allergic, recently bleeding, or told by a doctor to avoid it. Don't repeat the dose, and don't substitute acetaminophen or ibuprofen.",
  "Help them take their own nitroglycerin if prescribed, under the tongue, unless they've taken an erectile dysfunction drug in the past 24–48 hours (dangerous drop in blood pressure).",
  "Keep warm and calm. Prepare for CPR and an AED."],
 ev:["Rapid evacuation with as little movement or exertion as possible. Consider helicopter."],
 rel:["cpr","breathing-unclear"]},
{id:"asthma",c:"med",u:"evac",n:"Asthma attack",
 s:"Help them use their inhaler. Severe attacks are life-threatening.",
 sg:["Wheezing, mostly on breathing out; long, effortful exhales.","Coughing, chest tightness, fast heart rate and breathing.",
  "Severe: tripod position, straining neck muscles, can't speak full sentences, dusky or blue skin, anxiety then drowsiness."],
 tx:["Let them sit upright or in whatever position is easiest.","Help them find and use their rescue inhaler (albuterol) as prescribed.",
  "Keep them warm and away from triggers like smoke and cold air. Treat dehydration.",
  "If they tire, assist breathing with rescue breaths.",
  "Life-threatening attack not responding to the inhaler: epinephrine may be carefully considered by trained responders."],
 ev:["Prolonged or severe attacks: rapid evacuation.","Needing the inhaler much more often, or more frequent attacks."],
 rel:["anaphylaxis","breathing-unclear"]},
{id:"hypoglycemia",c:"med",u:"field",n:"Diabetic emergency (low or high blood sugar)",
 s:"A diabetic with a sudden change in behavior or responsiveness. First aid is the same for low and high: when in doubt, give sugar.",
 sg:["Low blood sugar (most emergencies, comes on fast): shaky, sweaty, cool skin, pale, hungry, headache, irritable or aggressive, blank stare, acting drunk, seizures, unresponsiveness. Often after a change in routine, extra exercise, missed food, or vomiting.",
  "High blood sugar (develops over hours to days): very thirsty, urinating often, tired, nausea or vomiting, fruity breath, deep fast breathing, drowsiness. Often after missed insulin, illness, or lost or frozen supplies.",
  "Not everyone with a blood sugar emergency knows they have diabetes."],
 tx:["If they carry a glucose meter, have them check. Otherwise treat as low blood sugar; 15–20 g of sugar won't meaningfully harm someone whose sugar is high.",
  "Able to follow commands and swallow: give 15–20 g of fast sugar (glucose tabs, chewable candy, about ½ cup juice or regular soda, honey, or a rich drink-mix slurry).",
  "Recheck in 10–15 minutes. Repeat sugar if not improving. Once better, give a meal or snack with carbohydrates and protein.",
  "Can't swallow safely: recovery position, then rub sugar paste or glucose gel inside the cheek. It can take 15 minutes or more to absorb; protect the airway and wait.",
  "Glucagon only if they carry it and you've been trained to use it.",
  "Keep insulin from freezing or overheating: carry it close to the body in cold weather."],
 ev:["Not improving within 10–15 minutes of sugar, can't swallow, decreasing responsiveness, or a seizure: rapid evacuation.",
  "Suspected high blood sugar: evacuate; it needs insulin and medical care.","Can't manage blood sugar with routine changes, insulin or supplies lost, or the cause is unclear."],
 av:["Never give insulin."],
 rel:["altered","seizure"]},
{id:"seizure",c:"med",u:"evac",n:"Seizure",
 s:"Protect them from injury, time it, and look for a cause.",
 sg:["Sudden jerking or stiffening, loss of awareness.","Drooling, loss of bladder control.","Drowsy and confused for minutes to an hour afterward."],
 tx:["Move hazards away and cushion the head. Don't hold them down or put anything in the mouth.",
  "Time the seizure.","Afterward, recovery position. Check airway and breathing. Let them rest, warm and with privacy.",
  "Look for a cause: head injury, low blood sugar, heat stroke, hyponatremia, HACE, carbon monoxide, epilepsy, alcohol or drug withdrawal."],
 ev:["Rapid evacuation for a first-ever seizure, one over 5 minutes, back-to-back seizures, injury, pregnancy, diabetes, not returning to normal, or a cause like trauma, heat, or altitude.",
  "Known epilepsy with a typical seizure and full recovery may not need evacuation. Decide together with the person."],
 rel:["hypoglycemia","tbi","heatstroke","hyponatremia","hace"]},
{id:"stroke",c:"med",u:"rapid",n:"Stroke",
 s:"Sudden one-sided weakness, slurred speech, or vision loss. Note the time it started.",
 sg:["BE FAST: Balance loss, Eyes (vision loss), Face droop or uneven smile, Arm drift or weakness on one side, Speech slurred or confused, Time to evacuate.","Sudden severe headache."],
 tx:["Note the exact time symptoms started. Treatment options depend on it.",
  "Nothing by mouth; swallowing may be impaired.",
  "Lie with head and shoulders slightly raised, or on their side with the weak side down if drowsy or vomiting.",
  "Keep warm and reassure.",
  "Check for mimics: low blood sugar, HACE at altitude, and carbon monoxide."],
 ev:["Rapid evacuation."],
 rel:["hypoglycemia","hace","co"]},
{id:"abdominal",c:"med",u:"field",n:"Abdominal pain",
 s:"Most belly aches pass. Think “sick or not sick,” and evacuate for red flags.",
 lab:{sg:"Red flags"},
 sg:["Significant pain lasting more than 8 hours, or sudden, severe pain.","Pain after abdominal trauma.",
  "Pain that limits walking, moving, or eating.","Rigid or swollen belly.","Fever.","Unable to drink or keep fluids down for 24 hours.",
  "Possible pregnancy (especially with bleeding or signs of shock).","Blood in vomit (coffee grounds), black tarry stool, or blood in urine.","Signs of shock.",
  "Appendicitis: pain starts near the navel and moves to the lower right, becoming constant; low fever, no appetite. Sudden relief can mean rupture."],
 tx:["No red flags: rest, clear fluids, simple food, and reassess every few hours.",
  "Red flags: position of comfort, clear liquids only or nothing, monitor vital signs, and watch for shock.",
  "Burning urination, blood in urine, or back or side pain: see Urinary problems."],
 ev:["Any red flag. Sudden severe pain: immediate evacuation."],
 rel:["gi","urinary","shock"]},
{id:"gi",c:"med",u:"field",n:"Diarrhea and vomiting",
 s:"Rehydrate in small, frequent sips and tighten up hygiene.",
 tx:["Clear fluids, sports drinks, or oral rehydration solution in small amounts. If tolerated for 12–24 hours, add simple foods.",
  "Rest. Limit caffeine.",
  "Bismuth (Pepto-Bismol) is an option. Loperamide (Imodium) per label only if there's no fever and no blood in the stool.",
  "Hygiene: wash hands or use sanitizer, treat all water, no shared hands in food bags, keep the sick person out of food prep.",
  "Giardia and similar parasites often show up 1–3 weeks after exposure, with bloating, cramps, sulfur-smelling gas. See a doctor."],
 ev:["Fever, vomiting, or diarrhea lasting more than 24 hours, especially with signs of dehydration.","Blood in stool or vomit.",
  "Can't keep fluids down for 24 hours.","Signs of sepsis or shock. Lower threshold for children."],
 rel:["dehydration","abdominal"]},
{id:"faint",c:"med",u:"field",n:"Fainting",
 s:"A brief blackout with fast recovery once lying flat. Look for the cause and check for injuries from the fall.",
 sg:["Lightheaded, sweaty, or tunnel vision just before.","Brief loss of consciousness, fully alert again soon after lying flat.",
  "Common triggers: standing a long time, heat, dehydration, pain, the sight of blood."],
 tx:["Lay flat and raise the legs about 12 in (30 cm) if uninjured.",
  "Check for head and spine injury from the fall.","Food and fluids once fully alert. Sit up slowly, then stand slowly.",
  "Not fully alert right away in the heat: treat as heat stroke."],
 ev:["No clear trigger, or fainting during exertion.","Chest pain, palpitations, or breathlessness.","Injury from the fall, slow recovery, repeated episodes, or heart history."],
 rel:["cardiac","heat-minor","heatstroke"]},
{id:"febrile-seizure",c:"med",u:"evac",n:"Febrile seizure (young child with fever)",
 s:"Seizures triggered by a fast-rising fever in children about 6 months to 5 years old. Frightening, usually brief and harmless, but evacuate.",
 sg:["A young child with a fever, often over 102 °F (39 °C), who suddenly stiffens, jerks, or rolls the eyes back.","Usually lasts under 5 minutes, followed by drowsiness."],
 tx:["Protect from injury, don't restrain, and put nothing in the mouth. Roll onto the side if you can. Time it.",
  "After: check breathing, recovery position, keep watching.",
  "Cool gently: remove extra clothing and sponge with room-temperature water, not cold.",
  "Offer fluids once fully awake.",
  "Fever reducer (acetaminophen or ibuprofen) only by the dose on the child product's label for their weight."],
 ev:["First febrile seizure, a seizure over 5 minutes or repeated, not waking normally, breathing trouble, stiff neck, a rash, or a child under 6 months: rapid evacuation.","All febrile seizures should be evaluated by a doctor."],
 rel:["seizure","fever"]},
{id:"opioid",c:"med",u:"rapid",n:"Opioid overdose",
 s:"Slow or stopped breathing with pinpoint pupils. Give naloxone and support breathing.",
 sg:["Very slow, shallow, snoring, or stopped breathing.","Unresponsive or very hard to wake.","Pinpoint pupils.","Blue or gray lips and fingertips; clammy skin.",
  "Clues: pain pills, patches, needles, a history of use. Street drugs may contain fentanyl."],
 tx:["Not breathing normally: start CPR with rescue breaths, and give naloxone as soon as it's available.",
  "Breathing but unresponsive: give naloxone, then keep watching breathing closely.",
  "Nasal spray: tilt the head back, insert the tip into a nostril until your fingers touch the nose, and press the plunger fully. Each device is a single dose; don't test it.",
  "No improvement in 2–5 minutes: give another dose with a new device, in either nostril.",
  "Say out loud that you're giving naloxone. It won't harm someone who hasn't taken opioids.",
  "Once breathing normally: recovery position. They may wake suddenly, confused, agitated, or vomiting.",
  "Naloxone wears off in 20–90 minutes, often before the opioid does. Keep watching and keep extra doses ready."],
 ev:["Rapid evacuation for anyone who needed naloxone, even if they recover."],
 av:["Naloxone doesn't reverse alcohol, sedatives, or other drugs, but give it anyway if opioids are possible."],
 rel:["cpr","alcohol","altered"]},
{id:"alcohol",c:"med",u:"rapid",n:"Alcohol poisoning",
 s:"Too much alcohol can stop breathing, cause choking on vomit, and drop body temperature. Never leave them alone.",
 sg:["Confusion, vomiting, very hard to wake or unresponsive.","Slow or irregular breathing.","Cold, pale, or bluish skin (hypothermia).","Seizures."],
 tx:["Recovery position to protect the airway; don't let them lie on their back.","Stay with them and check breathing regularly.",
  "Keep them warm and insulated from the ground.","Nothing by mouth if drowsy. Coffee, cold showers, and walking it off don't help.",
  "Look for other problems: head injury from a fall, low blood sugar, hypothermia, other drugs. If opioids are possible, give naloxone."],
 ev:["Can't be woken, slow or irregular breathing, a seizure, vomiting while drowsy, or an injury: rapid evacuation."],
 rel:["opioid","hypo-mild","altered"]},
{id:"poison",c:"med",u:"evac",n:"Swallowed poison (plants, mushrooms, medication, fuel)",
 s:"Find out what and how much, don't induce vomiting, and get advice. Wild mushrooms with delayed vomiting can be deadly.",
 sg:["Open container, leftover plant or mushroom, or a report of what they ate.","Burns around the mouth, drooling, burning in the mouth or throat.",
  "Nausea, vomiting, diarrhea, cramps, dizziness, drowsiness, seizures, unresponsiveness.",
  "Wild mushrooms: vomiting and diarrhea starting 6 or more hours after eating can mean a liver-destroying species, even if they briefly improve.",
  "Water hemlock and similar plants: seizures within an hour or two.","Stove fuel: coughing, choking, or trouble breathing (fuel in the lungs)."],
 tx:["Not breathing: start CPR. Use compression-only CPR if poison is on the mouth or face.",
  "Call Poison Control (US: 1-800-222-1222) when you have signal, or include the details in your SOS message.",
  "Don't induce vomiting unless Poison Control tells you to. Rinse the mouth.",
  "Save a sample: the container, the rest of the plant or mushroom, or vomit, and send it with the patient.",
  "Recovery position if drowsy or vomiting. Nothing more by mouth unless advised.",
  "Note what was taken, how much, and when."],
 ev:["Altered responsiveness, breathing trouble, or seizures: rapid evacuation.","Any symptoms after eating a wild mushroom or plant, especially delayed vomiting: rapid evacuation.",
  "Medication overdose, or fuel swallowed with any coughing: evacuate."],
 av:["Don't eat wild mushrooms unless an expert has identified them."],
 rel:["altered","chemical","alcohol","opioid"]},
{id:"rhabdo",c:"med",u:"evac",n:"Rhabdomyolysis (muscle breakdown)",
 s:"Damaged muscle releases proteins that can shut down the kidneys. Severe muscle pain with dark urine after extreme exertion, a crush, or long immobility means rapid evacuation.",
 sg:["Triggers: extreme or unaccustomed exertion (long descents, heavy loads, first hard days), especially in heat or when dehydrated; a crush or long entrapment; lying immobile for hours after a fall, hypothermia, or intoxication; heat stroke; some drugs and supplements.",
  "Muscle pain, tenderness, swelling, or weakness far beyond normal soreness, often in the thighs, calves, back, or shoulders.",
  "Dark urine (tea, cola, or reddish brown), or very little urine.","Severe: nausea, vomiting, confusion, irregular heartbeat."],
 tx:["Stop all exertion. Rest in shade and cool them if they're hot.",
  "If alert and able to swallow, drink steadily with electrolytes to keep urine flowing and light-colored. Avoid huge volumes of plain water.",
  "Don't give ibuprofen, naproxen, or other NSAIDs; they can worsen kidney injury. Acetaminophen per label is OK for pain.",
  "Track urine color and amount, and vital signs.",
  "After a crush or long entrapment, see Crush injury."],
 ev:["Dark urine, little urine, severe pain or swelling, vomiting, or confusion: rapid evacuation for IV fluids and blood tests.","Suspected rhabdomyolysis with normal-colored urine: evacuate anyway for blood tests."],
 av:["No NSAIDs.","Don't push through severe, unexplained muscle pain on a hard trip."],
 rel:["crush","heatstroke","urinary","dehydration","hyponatremia"]},
{id:"hyperventilation",c:"med",u:"field",n:"Hyperventilation (panic breathing)",
 s:"Fast breathing from anxiety or panic. Rule out every other cause before calling it panic.",
 sg:["Rapid, shallow breathing and a feeling of not getting enough air.","Tingling or numbness in fingers, toes, or around the mouth; cramping hands.","Dizziness, fear, sweating, headache."],
 tx:["First rule out asthma, anaphylaxis, chest injury, heart problems, HAPE at altitude, low blood sugar, and head injury.",
  "Sit them down, leaning forward if that's easier. Reassure them calmly.",
  "Coach slow breaths: in slowly through the nose, hold for a few seconds, then breathe out slowly.",
  "Help them take any breathing medication they carry."],
 ev:["Doesn't settle within a few minutes, chest pain, decreasing responsiveness, or any suspicion of another cause."],
 av:["Don't have them breathe into a paper bag."],
 rel:["breathing-unclear","psych","asthma"]},
{id:"fever",c:"med",u:"field",n:"Fever",
 s:"Usually an infection the body can fight. Some combinations of fever and other signs need fast evacuation.",
 lab:{sg:"Red flags"},
 sg:["Stiff neck, severe headache, confusion, or a purple or pinpoint rash that doesn't fade when pressed: rapid evacuation.",
  "Signs of sepsis: confusion, fast breathing (over 22 a minute), fast pulse (over 90), weak pulses, or very low or high temperature.",
  "Fever after a tick bite, animal bite, wound, or burn.","Fever with breathing trouble, severe belly or back pain, or painful urination.",
  "Fever over 103 °F (39.4 °C) that won't come down, or lasting more than 24 hours with vomiting or diarrhea."],
 tx:["Rest, drink plenty of fluids, and dress in light layers.","Acetaminophen or ibuprofen per label.","Look for the source: wounds, throat, chest, urine, belly, recent bites.",
  "Recheck temperature and vital signs every few hours."],
 ev:["Any red flag.","Not improving after 24 hours, or getting weaker."],
 rel:["respiratory","wound","tick","urinary","febrile-seizure"]},
{id:"respiratory",c:"med",u:"field",n:"Colds, sore throat, and chest infections",
 s:"Most are viral and run their course. Watch for pneumonia, throat abscess, and, at altitude, HAPE.",
 sg:["Runny nose, sore throat, mild cough, low energy: a cold.",
  "Fever with a productive cough, chest pain on breathing, or shortness of breath: possible pneumonia.",
  "Severe sore throat on one side, drooling, a muffled voice, or trouble opening the mouth or swallowing: possible throat abscess.",
  "At altitude, breathlessness at rest is HAPE until proven otherwise."],
 tx:["Rest, warm fluids, and extra calories.","Throat lozenges or warm salt-water gargles.","Acetaminophen or ibuprofen per label.","Keep the sick person's cup, utensils, and food separate."],
 ev:["Shortness of breath, trouble swallowing, drooling, or a high fever: rapid evacuation.","Fever with a productive cough, or symptoms worsening after 2–3 days."],
 rel:["hape","fever","asthma"]},
{id:"headache",c:"med",u:"field",n:"Headache",
 s:"Usually dehydration, sun, hunger, poor sleep, or caffeine withdrawal. Look for the dangerous causes first.",
 lab:{sg:"Red flags"},
 sg:["Sudden, severe, worst-ever headache: rapid evacuation (possible bleeding in the brain).","After a head injury, or with confusion, weakness, slurred speech, or vision changes.",
  "With fever and a stiff neck.","At altitude: treat as AMS; with stumbling or confusion, HACE.","After time in a tent or shelter with a stove running: carbon monoxide.","Getting steadily worse over hours."],
 tx:["Drink fluids with electrolytes, eat, rest in shade, and cover your head in sun.","Acetaminophen or ibuprofen per label.","Caffeine for regular coffee drinkers who skipped it."],
 ev:["Any red flag.","Headache that keeps worsening despite treatment."],
 rel:["ams","co","stroke","tbi","dehydration"]},
{id:"constipation",c:"med",u:"field",n:"Constipation",
 s:"Common with trip food, dehydration, and reluctance to use a cathole. Usually fixed with fluids and fiber.",
 sg:["Fewer bowel movements than usual, hard stools, bloating, cramping, urge without results."],
 tx:["Drink more water. Eat fruit, dried fruit, oatmeal, and other fiber.","Coffee or other caffeine, and walking, help get things moving.","Make time and privacy for a regular bathroom routine.","A stool softener or laxative per label if carried."],
 ev:["Severe or constant belly pain, a swollen belly, vomiting, or no gas passing: see Abdominal pain and evacuate."],
 rel:["abdominal","dehydration"]},
{id:"urinary",c:"med",u:"field",n:"Urinary problems (blood in urine, UTI, kidney stone)",
 s:"Burning, frequent urination, or blood or dark color in the urine. Most is infection, but some causes need fast evacuation.",
 lab:{sg:"Likely causes"},
 sg:["Bladder infection (UTI): burning, frequent or urgent urination with little coming out; urine may be cloudy, pink, or bloody.",
  "Kidney infection: UTI signs plus fever, chills, or pain in the back or side.",
  "Kidney stone: sudden, severe pain in the back or side that moves toward the groin, often with nausea; may have blood in the urine.",
  "Kidney injury: blood in the urine after a fall or a blow to the back, side, or belly.",
  "Muscle breakdown: dark cola- or tea-colored urine after extreme exertion, a crush, heat illness, or lying immobile. See Rhabdomyolysis."],
 tx:["Drink steadily to keep urine flowing, unless they can't keep fluids down or a kidney injury is suspected.",
  "UTI: antibiotics if carried and prescribed for this. Urinate often and keep clean.",
  "Kidney stone: position of comfort, fluids, pain medication per label.",

  rapid:["Rapid evacuation","Call 911 or trigger SOS now. Use the fastest transport available, including helicopter."],

  field:["Treat in the field","Treat, monitor, and reassess every 15–30 minutes. Evacuate if anything gets worse."],
  info:["Scene not safe","Make it safe or wait. Then start the assessment again."]
};
const view = document.getElementById("view");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = () => { const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const KEY = "bct-state-v1";

let tab = "assess", libCat = "all", libQ = "";
let stack;
function fresh(){ return [{node:"start", adds:[], esc:{}, trail:[], started:now()}]; }
try { const s = JSON.parse(localStorage.getItem(KEY)); stack = (Array.isArray(s) && s.length) ? s : fresh(); } catch(e){ stack = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(stack)); } catch(e){} };
const top = () => stack[stack.length-1];

function eff(id, escMap){
  const c = BY[id]; let r = c.u ? RANK[c.u] : 0;
  const e = escMap && escMap[id]; if (e && RANK[e] > r) r = RANK[e];
  return r;
}
const lvl = r => r===3?"rapid":r===2?"evac":r===1?"field":null;

function answer(edge, label){
  const cur = top(), node = TREE[cur.node];
  const adds = cur.adds.slice(); (edge.add||[]).forEach(a=>{ if(!adds.includes(a)) adds.push(a); });
  const e = Object.assign({}, cur.esc);
  Object.entries(edge.esc||{}).forEach(([k,v])=>{ if(!e[k] || RANK[v]>RANK[e[k]]) e[k]=v; });
  stack.push({node: edge.to || null, adds, esc:e, trail: cur.trail.concat([{t:now(), q:node.q, a:label}]), started:cur.started});
  save(); render(); window.scrollTo(0,0);
}

function chipsHTML(ids, escMap){
  return ids.map(id=>{ const l=lvl(eff(id,escMap)); return `<button class="chip ${l||""}" data-open="${id}">${esc(BY[id].n)}</button>`; }).join("");
}

function trailHTML(st){
  if(!st.trail.length) return "";
  return `<section class="trail"><h3>Your answers · started ${esc(st.started)}</h3><ol>${st.trail.map(x=>`<li><time>${esc(x.t)}</time><span class="qq">${esc(x.q)}</span><span class="a">${esc(x.a)}</span></li>`).join("")}</ol></section>`;
}

function renderQuestion(){
  const st = top(), node = TREE[st.node];

  if (life.length){
    const c = BY[life[life.length-1]];
    h += `<div class="treatnow"><p>Treat ${esc(c.n.toLowerCase())} now, then keep going.</p><button data-open="${c.id}">Open steps</button></div>`;
  }
  if (st.adds.length) h += `<div class="found"><span class="lbl">Found so far</span>${chipsHTML(st.adds, st.esc)}</div>`;
  h += `<section class="q"><div class="phase"><span>${esc(node.p)}</span><i>Q${n}</i></div><h2 id="qh">${esc(node.q)}</h2>${node.h?`<p class="help">${esc(node.h)}</p>`:""}`;
  if (node.opts){
    h += `<div class="opts">${node.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o.l)}</button>`).join("")}</div>`;
  } else {
    h += `<div class="yn"><button class="big yes" data-yn="yes">Yes</button><button class="big no" data-yn="no">No</button></div>`;
  }
  h += `</section><div class="navrow"><button class="ghost" id="back" ${stack.length<2?"disabled":""}>Back</button><button class="ghost" id="restart" ${stack.length<2?"disabled":""}>Start over</button></div>`;
  h += trailHTML(st);
  if (stack.length<2) h += `<p class="disc">A decision aid for people with wilderness first aid training. It doesn't replace training, judgment, or professional care. If someone's life is at risk, call 911 or use your satellite messenger's SOS.</p>`;
  view.innerHTML = h;
  view.querySelectorAll("[data-yn]").forEach(b=>b.onclick=()=>answer(node[b.dataset.yn], b.dataset.yn==="yes"?"Yes":"No"));
  view.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{ const o=node.opts[+b.dataset.opt]; answer(o, o.l); });
}

function sec(title, arr, cls, ordered){
  if(!arr || !arr.length) return "";
  const tag = ordered ? "ol" : "ul";
  return `<div class="sec ${cls}"><h3>${esc(title)}</h3><${tag}>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</${tag}></div>`;
}
function bodyHTML(c, opts){
  const L = Object.assign({sg:"Signs", tx:"Treatment", ev:"Evacuate if", av:"Avoid"}, c.lab||{});
  let h = "";
  if (opts.signs) h += sec(L.sg, c.sg, "sg", false);
  h += sec(L.tx, c.tx, "tx", true) + sec(L.ev, c.ev, "ev", false) + sec(L.av, c.av, "av", false);
  return h;
}

function renderResult(){
  const st = top();
  let ids = st.adds.slice();
  const sceneOnly = ids.length===1 && ids[0]==="scene";
  if (!ids.length) ids = ["none"];
  ids.sort((a,b)=> (eff(b,st.esc)-eff(a,st.esc)) || (BY[a].i-BY[b].i));
  const top3 = Math.max(...ids.map(id=>eff(id,st.esc)));
  const key = sceneOnly ? "info" : (lvl(top3) || "field");
  const [bt, bp] = BANNER[key];
  let h = `<div class="res"><div class="banner ${key}"><div class="k">Disposition · ${esc(now())}</div><h2>${esc(bt)}</h2><p>${esc(bp)}</p></div><div class="cards">`;
  ids.forEach((id,idx)=>{
    const c = BY[id], r = eff(id, st.esc), l = lvl(r);
    const raised = c.u && r > RANK[c.u];
    h += `<details class="card ${l||""}" ${idx<4?"open":""}><summary><h3>${esc(c.n)}</h3>${l?`<span class="pill ${l}">${ULABEL[l]}</span>`:""}</summary><div class="body"><p class="lede">${esc(c.s)}</p>${raised?`<p class="note">Urgency raised because of your answers.</p>`:""}${bodyHTML(c,{signs:false})}<p style="margin:14px 0 0"><button class="link" data-open="${id}">Signs and full details</button></p></div></details>`;
  });
  h += `</div><div class="navrow"><button class="ghost" id="back">Back</button><button class="ghost" id="restart">New assessment</button><button class="ghost" id="copy">Copy summary</button></div>`;
  h += `<textarea class="copybox" id="copybox" hidden readonly aria-label="Assessment summary"></textarea>`;
  h += trailHTML(st) + `</div>`;
  view.innerHTML = h;
  document.getElementById("copy").onclick = () => copySummary(ids, st, bt);
}

function copySummary(ids, st, bt){
  const d = new Date();
  let t = `BACKCOUNTRY TRIAGE ${d.toLocaleDateString()} · started ${st.started}\nDisposition: ${bt.toUpperCase()}\nProblems:\n`;
  ids.forEach(id=>{ const l=lvl(eff(id,st.esc)); t += `- ${BY[id].n}${l?` (${ULABEL[l]})`:""}\n`; });
  t += `\nAssessment:\n` + st.trail.map(x=>`${x.t} ${x.q} ${x.a.toUpperCase()}`).join("\n");
  const box = document.getElementById("copybox");
  const fallback = () => { box.hidden=false; box.value=t; box.focus(); box.select(); toast("Select and copy the text below"); };
  try { navigator.clipboard.writeText(t).then(()=>toast("Copied. Paste into a message or SOAP note."), fallback); } catch(e){ fallback(); }
}

function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }

function renderLib(){
  const q = libQ.trim().toLowerCase();
  const list = CONDS.filter(c=>!c.hide && (libCat==="all"||c.c===libCat) && (!q || [c.n,c.s].concat(c.sg||[],c.tx||[]).join(" ").toLowerCase().includes(q)));
  let h = `<input class="search" id="q" type="search" placeholder="Search: frostbite, rattlesnake, wheezing…" value="${esc(libQ)}" autocomplete="off" aria-label="Search conditions">`;
  h += `<div class="cats">${[["all","All"]].concat(CATS).map(([k,v])=>`<button data-cat="${k}" aria-pressed="${libCat===k}">${esc(k==="assess"?"Assessment":v)}</button>`).join("")}</div>`;
  if (!list.length) h += `<p class="empty">Nothing matches “${esc(libQ)}”. Try a symptom, like “numb” or “vomiting”.</p>`;
  CATS.forEach(([k,v])=>{
    const items = list.filter(c=>c.c===k); if(!items.length) return;
    h += `<section class="group"><h2>${esc(v)} · ${items.length}</h2><div class="rows">${items.map(c=>`<button class="row" data-open="${c.id}"><b>${esc(c.n)}</b>${c.u?`<span class="pill ${c.u}">${ULABEL[c.u]}</span>`:"<span></span>"}<span class="s">${esc(c.s)}</span></button>`).join("")}</div></section>`;
  });
  h += `<p class="disc">Version ${APP_VERSION} · ${APP_DATE}. Urgency shown is the usual starting point. Answers in the assessment can raise it. Aligned with Aerie Backcountry Medicine, Wilderness Medicine 15th ed. Doses refer to the product label or a prescription the person carries.</p>`;
  view.innerHTML = h;
  const inp = document.getElementById("q");
  inp.oninput = e => { libQ = e.target.value; const pos = e.target.selectionStart; renderLib(); const n=document.getElementById("q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} };
  view.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ libCat=b.dataset.cat; renderLib(); });
}

const sheet = document.getElementById("sheet"), sheetBody = document.getElementById("sheet-body");
let lastFocus = null;
function openSheet(id){
  const c = BY[id]; if(!c) return;
  if (sheet.hidden) lastFocus = document.activeElement;
  let h = `<div class="eyebrow">${esc(CATNAME[c.c])}</div><h2 id="sheet-title">${esc(c.n)}</h2>${c.u?`<span class="pill ${c.u}">${ULABEL[c.u]}</span>`:""}<p class="lede">${esc(c.s)}</p>${bodyHTML(c,{signs:true})}`;
  if (c.rel && c.rel.length) h += `<div class="sec"><h3>Related</h3><div class="rel">${c.rel.filter(r=>BY[r]).map(r=>`<button class="chip ${BY[r].u||""}" data-open="${r}">${esc(BY[r].n)}</button>`).join("")}</div></div>`;
  sheetBody.innerHTML = h;
  sheet.hidden = false; sheet.scrollTop = 0; document.body.style.overflow = "hidden";
  document.getElementById("sheet-close").focus();
}
function closeSheet(){ sheet.hidden = true; document.body.style.overflow = ""; if(lastFocus && lastFocus.focus) lastFocus.focus(); }
document.getElementById("sheet-close").onclick = closeSheet;
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !sheet.hidden) closeSheet(); });

document.addEventListener("click", e=>{
  const o = e.target.closest("[data-open]"); if (o){ e.preventDefault(); openSheet(o.dataset.open); return; }
  if (e.target.id==="back" && stack.length>1){ stack.pop(); save(); render(); }
  if (e.target.id==="restart"){ stack = fresh(); save(); render(); window.scrollTo(0,0); }
});

function setTab(t){
  tab = t;
  document.getElementById("tab-assess").setAttribute("aria-selected", t==="assess");
  document.getElementById("tab-lib").setAttribute("aria-selected", t==="lib");
  render(); window.scrollTo(0,0);
}
document.getElementById("tab-assess").onclick = ()=>setTab("assess");
document.getElementById("tab-lib").onclick = ()=>setTab("lib");

function render(){
  if (tab==="lib") return renderLib();
  if (top().node && TREE[top().node]) renderQuestion(); else renderResult();
}
render();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
